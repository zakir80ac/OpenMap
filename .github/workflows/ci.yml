# REQ-CORE-008 REQ-QA-002 REQ-QA-004 REQ-INT-003 — CI: guard, tracker verify, typecheck, unit tests, contracts, i18n;
# integration tests on the compose datastores; Playwright e2e (en, ar) on the full compose stack; helm install on kind.
name: ci
on:
  push: { branches: [main] }
  pull_request:
  # REQ-PERF-004: the timed discovery sweep runs nightly (it replays an 11k-device estate).
  schedule:
    - cron: "0 1 * * *"
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: pnpm install --frozen-lockfile
      # The console build fetches its fonts (next/font/google), which fails now and then on a runner: up to three
      # attempts, the output reported if all fail.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/reported"
          for attempt in 1 2 3; do pnpm build > "$RUNNER_TEMP/reported/build.log" 2>&1 && exit 0; tail -n 30 "$RUNNER_TEMP/reported/build.log"; sleep 20; done
          exit 1
      - run: pnpm contracts:check -- --base origin/${{ github.base_ref || 'main' }}
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm guard
      - run: pnpm tracker verify
      - run: pnpm tracker report
      - uses: ./.github/actions/report-failure
        if: failure()
      - uses: actions/upload-artifact@v4
        with: { name: tracker, path: "tracker/OpenMap-Tracker.xlsx" }
  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp deploy/compose/.env.example deploy/compose/.env
      # REQ-INT-016: the identity-source tests apply directories and providers to Keycloak.
      - uses: ./.github/actions/stack-up
        with: { services: postgres memgraph clickhouse valkey meilisearch openbao keycloak }
      - uses: ./.github/actions/stack-env
      - run: pnpm build
      - run: pnpm --filter @openmap/db migrate
      # Some suites (the dependency-mapping pass, T-150) read a replayed synthetic estate with flows; the estate is
      # generated (the fixtures under packages/testing/fixtures/synth* are not committed).
      - name: Replay a small synthetic estate
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          pnpm --filter @openmap/synth-estate synth generate --seed 42 --scale 0.05 --out "$RUNNER_TEMP/estate" 2>&1 | tee "$RUNNER_TEMP/reported/replay.log"
          pnpm --filter @openmap/reconciler replay --dir "$RUNNER_TEMP/estate" 2>&1 | tee -a "$RUNNER_TEMP/reported/replay.log"
          # Memgraph's after-commit triggers keep working through the replay's writes in background transactions, and a
          # schema statement needs the storage to itself: wait (up to ten minutes) until only this query runs.
          for i in $(seq 1 120); do
            n=$(echo "SHOW TRANSACTIONS;" | docker compose -f deploy/compose/docker-compose.yml exec -T memgraph mgconsole --host 127.0.0.1 --port 7687 --use-ssl=true --output-format=csv | tail -n +2 | wc -l)
            [ "$n" -le 1 ] && { echo "memgraph idle after ${i} checks"; break; }
            sleep 5
          done
      - name: Integration suites
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          pnpm -r --stream --workspace-concurrency=1 --filter './packages/*' --filter './apps/*' run --if-present test:integration 2>&1 | tee "$RUNNER_TEMP/reported/integration.log"
      - uses: ./.github/actions/report-failure
        if: failure()
      - run: docker compose -f deploy/compose/docker-compose.yml down -v
        if: always()
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    # The suite runs about 120 tests in two locales with one worker (about 50 minutes), after the stack build.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The console build fetches its fonts (next/font/google), which fails now and then on a runner: up to three
      # attempts, the output reported if all fail.
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/reported"
          for attempt in 1 2 3; do pnpm build > "$RUNNER_TEMP/reported/build.log" 2>&1 && exit 0; tail -n 30 "$RUNNER_TEMP/reported/build.log"; sleep 20; done
          exit 1
      - run: cp deploy/compose/.env.example deploy/compose/.env
      - name: Build and start the full stack
        working-directory: deploy/compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml build
          docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d
      - uses: ./.github/actions/stack-env
      - name: Wait for the API and the console
        run: |
          for i in $(seq 1 90); do curl -sf http://localhost:4000/readyz >/dev/null && curl -sf http://localhost:3000/en >/dev/null && exit 0; sleep 5; done
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml ps
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml logs --tail=100 api console migrate
          exit 1
      # The suite reads the dev estate (seed 42, scale 0.05, tenant synth-ac9a6a65) with its health, utilisation, power
      # and environment histories, as a dev stack holds it; the realm's seeded users are pointed at that tenant.
      - name: Seed the estate the e2e suite reads
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          estate="$RUNNER_TEMP/estate"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            pnpm --filter @openmap/synth-estate synth generate --seed 42 --scale 0.05 --out "$estate"
            pnpm --filter @openmap/reconciler replay --dir "$estate"
            pnpm --filter @openmap/synth-estate synth health-history --dir "$estate" --seed 42 --now "$now"
            pnpm --filter @openmap/reconciler replay-history --dir "$estate"
            for kind in utilisation power environment; do
              pnpm --filter @openmap/synth-estate synth "$kind-history" --dir "$estate" --out "$RUNNER_TEMP/estate-$kind" --seed 42 --now "$now"
              pnpm --filter @openmap/reconciler replay --dir "$RUNNER_TEMP/estate-$kind"
            done
            pnpm --filter @openmap/perf e2e-users --tenant "synth-$(sed -n 's/.*"tenantId": *"\([0-9a-f]*\)-.*/\1/p' "$estate/estate-summary.json" | head -n 1)"
          } 2>&1 | tee "$RUNNER_TEMP/reported/seed.log"
      # apt mirrors on the runner fail now and then; the install is retried.
      - name: Install the e2e browser
        run: for attempt in 1 2 3; do pnpm --filter @openmap/console exec playwright install --with-deps chromium && exit 0; sleep 30; done; exit 1
      - name: Playwright e2e
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          pnpm --filter @openmap/console e2e 2>&1 | tee "$RUNNER_TEMP/reported/e2e.log"
      # REQ-PERF-005 (ADR-071): the e2e run's perf spec writes the screen-interaction and graph-render results; Lighthouse
      # audits the same production console; guard then holds all three to PERF_BUDGETS and fails if one was not written.
      - run: pnpm --filter @openmap/perf lighthouse
      - run: pnpm guard --perf-only --require-perf screen-interaction,graph-render,lighthouse
      - uses: ./.github/actions/report-failure
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: "apps/console/e2e/screenshots" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-perf-results, path: "tools/perf/results" }
      - run: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml down -v
        if: always()
  # REQ-PERF-002: the impact query budget (p95 < PERF_BUDGETS.impactQuery100kP95Ms) on a 110k-CI estate, enforced by guard.
  perf:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 120
    # The impact-validation sweep and link probes off, so the measurement is the query alone.
    env: { IMPACT_VALIDATION_INTERVAL_MS: "0", LINK_PROBE_INTERVAL_MS: "0" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: grafana/setup-k6-action@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp deploy/compose/.env.example deploy/compose/.env
      - name: Build the API image
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml build api
      - uses: ./.github/actions/stack-up
        with: { files: "-f docker-compose.yml -f docker-compose.apps.yml", services: postgres memgraph clickhouse valkey meilisearch openbao keycloak api }
      - uses: ./.github/actions/stack-env
      - name: Load a 110k-CI estate
        run: |
          pnpm --filter @openmap/synth-estate synth generate --seed 43 --scale 0.2 --out ${{ runner.temp }}/estate
          pnpm --filter @openmap/reconciler replay --dir ${{ runner.temp }}/estate --reset
      - name: Wait for the API
        run: for i in $(seq 1 60); do curl -sf http://localhost:4000/readyz >/dev/null && exit 0; sleep 5; done; exit 1
      - name: Impact budget
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          pnpm --filter @openmap/perf impact-budget 2>&1 | tee "$RUNNER_TEMP/reported/impact-budget.log"
      # REQ-PERF-005: the telemetry fleet table's page budget on the same estate.
      - name: Telemetry fleet budget
        run: |
          set -o pipefail
          pnpm --filter @openmap/perf telemetry-budget 2>&1 | tee "$RUNNER_TEMP/reported/telemetry-budget.log"
      - run: pnpm guard --perf-only --require-perf impact-query,telemetry-fleet
      - uses: ./.github/actions/report-failure
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: perf-results, path: "tools/perf/results" }
      - run: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.apps.yml down -v
        if: always()
  # REQ-PERF-004: a discovery sweep of the synthetic estate (seed 44, scale 0.25, about 11,000 devices) through the
  # reconciler, timed and scaled to minutes per 10,000 devices; guard fails over PERF_BUDGETS.discoverySweepMinutes.
  sweep:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[sweep]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cp deploy/compose/.env.example deploy/compose/.env
      - uses: ./.github/actions/stack-up
        with: { services: postgres memgraph clickhouse valkey meilisearch openbao }
      - uses: ./.github/actions/stack-env
      - run: pnpm --filter @openmap/db migrate
      - name: Discovery sweep
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/reported"
          pnpm --filter @openmap/perf discovery-sweep --seed 44 --scale 0.25 --out ${{ runner.temp }}/estate 2>&1 | tee "$RUNNER_TEMP/reported/discovery-sweep.log"
      - run: pnpm guard --perf-only --require-perf discovery-sweep
      - uses: ./.github/actions/report-failure
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sweep-results, path: "tools/perf/results" }
      - run: docker compose -f deploy/compose/docker-compose.yml down -v
        if: always()
  kind:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: openmap, config: deploy/kind/cluster.yaml }
      - name: Build the application images
        working-directory: deploy/compose
        run: docker compose -f docker-compose.yml -f docker-compose.apps.yml build api scheduler reconciler bsm-engine node console
      - name: Load the images into the cluster
        run: for img in api scheduler reconciler bsm-engine node console; do kind load docker-image "openmap/$img:dev" --name openmap; done
      - run: helm lint deploy/helm/openmap
      - run: helm install openmap deploy/helm/openmap -f deploy/helm/openmap/values-local.yaml --wait --timeout 20m
      - name: Smoke test
        run: |
          kubectl get pods
          kubectl wait --for=condition=complete --timeout=10m job -l app.kubernetes.io/component=migrate || kubectl get jobs
          kubectl port-forward svc/openmap-api 4000:4000 >/dev/null 2>&1 &
          kubectl port-forward svc/openmap-console 3000:3000 >/dev/null 2>&1 &
          sleep 5
          curl -sf http://localhost:4000/readyz
          curl -sf http://localhost:4000/healthz
          curl -sf -o /dev/null -w "console %{http_code}\n" http://localhost:3000/en/dashboard
      - run: kubectl get pods -A && kubectl describe pods | tail -200
        if: failure()
      # The job log needs a signed-in viewer: the pods that are not ready, their recent events and log tails go into
      # one annotation the public API serves.
      - name: Report the pods that are not ready
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/reported"
          {
            kubectl get pods -o wide
            for pod in $(kubectl get pods --no-headers | awk '{ split($2, r, "/"); if (r[1] != r[2] && $3 != "Completed") print $1 }'); do
              echo "== $pod"
              kubectl describe pod "$pod" | sed -n '/^Events:/,$p' | tail -n 8
              for c in $(kubectl get pod "$pod" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
                echo "-- $c"
                kubectl logs "$pod" -c "$c" --tail 6 2>&1 || true
              done
            done
          } > "$RUNNER_TEMP/reported/kind.log" 2>&1 || true
          # PostgreSQL passes its readiness probe through the local socket even when the applications cannot use it,
          # so its own log (and the previous container's, after a restart) is reported whatever its state.
          {
            for c in postgres pgtde-agent; do
              echo "-- $c"
              kubectl logs statefulset/openmap-postgres -c "$c" --tail 40 2>&1 || true
              echo "-- $c (previous)"
              kubectl logs statefulset/openmap-postgres -c "$c" --previous --tail 25 2>&1 || true
            done
          } > "$RUNNER_TEMP/reported/kind-postgres.log" 2>&1 || true
      - uses: ./.github/actions/report-failure
        if: failure()
        with: { failure-lines: "60", tail-lines: "60" }
