# REQ-CORE-006 — OpenMap GraphQL contract, version 1.43.0 (see docs/CONTRACTS.md). Checked by `pnpm contracts:check`.
# Served by apps/api (Mercurius). Breaking changes require an ADR and a tracker row.

scalar DateTime
scalar JSON
scalar UUID

enum CiLayer {
  dc
  network_security
  hardware
  storage
  virtualization
  cloud
  os
  containers
  databases
  applications
  saas
  unknown
}
enum Lifecycle {
  discovered
  managed
  planned
  retired
}
enum HealthState {
  healthy
  degraded
  down
  unknown
}
enum PredictedState {
  down
  degraded
  at_risk
  unaffected
}
enum AssetStage {
  planned
  in_stock
  deployed
  spare
  rma
  retired
  disposed
}
enum AssetSource {
  plan
  discovery
  manual
}
enum AssetDataGap {
  warranty
  subscription
  support
  end_of_life
}
enum PlanStatus {
  draft
  approved
  building
  live
  cancelled
}
enum IntegrationHealth {
  healthy
  warning
  failing
  disabled
}
enum Direction {
  upstream
  downstream
  both
}

type Provenance {
  collectorId: String!
  nodeId: String!
  runId: String!
  confidence: Float!
}
type ExternalId {
  source: String!
  id: String!
}
type UserLabel {
  title: String!
  description: String!
  layer: CiLayer!
  type: String
  labelledBy: String!
  labelledAt: DateTime!
}

type Ci {
  id: UUID!
  tenantId: UUID!
  type: String!
  layer: CiLayer!
  name: String!
  displayName: String!
  """
  Short code spoken in incidents and printed on cards (layer prefix plus slug); unique per tenant, editable by operators.
  """
  code: String!
  identity: JSON!
  attributes: JSON!
  tags: [String!]!
  """
  Values of the tenant's custom fields that apply to this CI's type, keyed by field key (REQ-CMDB-015).
  """
  customFields: JSON!
  externalIds: [ExternalId!]!
  lifecycle: Lifecycle!
  userLabel: UserLabel
  source: Provenance!
  observedAt: DateTime!
  validFrom: DateTime!
  validTo: DateTime
  health: HealthState!
  """
  The layer's headline measurement (ADR-016): the latest ClickHouse sample of the metric LAYER_HEADLINE_METRIC names for the CI's layer; value and observedAt are null until a collector has sampled it. For the unknown layer the value is the days since the CI was last observed.
  """
  headlineMetric: HeadlineMetric!
  relationships(
    direction: Direction = both
    types: [String!]
    first: Int = 50
    after: String
  ): RelationshipConnection!
  asset: AssetRecord
  vulnerabilities: [Vulnerability!]!
  history(from: DateTime, to: DateTime): [CiVersion!]!
  "REQ-CMDB-014 (ADR-037): the parts inside this CI, by kind then slot; removed parts only on request."
  components(includeRemoved: Boolean = false): [HardwareComponent!]!
  "REQ-CMDB-034: CPU, memory, disk and power over the last `hours` (default 168); null for types without utilisation."
  utilisation(hours: Int): CiUtilisation
}

type CiVersion {
  validFrom: DateTime!
  validTo: DateTime
  attributes: JSON!
  lifecycle: Lifecycle!
  source: Provenance!
}

"""
One headline measurement: key and label from the contract's LAYER_HEADLINE_METRIC, unit as printed after the value, metric as stored in ClickHouse.
"""
type HeadlineMetric {
  key: String!
  label: String!
  unit: String!
  metric: String!
  value: Float
  observedAt: DateTime
}

type Relationship {
  id: UUID!
  type: String!
  from: Ci!
  to: Ci!
  attributes: JSON!
  source: Provenance!
  validFrom: DateTime!
  validTo: DateTime
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}
type CiEdge {
  cursor: String!
  node: Ci!
}
type CiConnection {
  edges: [CiEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
type RelationshipEdge {
  cursor: String!
  node: Relationship!
}
type RelationshipConnection {
  edges: [RelationshipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CiFilter {
  types: [String!]
  layers: [CiLayer!]
  lifecycle: [Lifecycle!]
  tags: [String!]
  siteId: UUID
  text: String
  attributeEquals: JSON
  health: [HealthState!]
  asOf: DateTime
  """
  Custom field values a CI must carry, keyed by field key (REQ-CMDB-015).
  """
  customFields: JSON
}

type ImpactNode {
  ci: Ci!
  depth: Int!
  predicted: PredictedState!
  path: [UUID!]!
}
type ImpactResult {
  root: Ci!
  nodes: [ImpactNode!]!
  services: [AffectedService!]!
  durationMs: Int!
}
type AffectedService {
  service: Ci!
  tier: Int!
  predicted: PredictedState!
  path: [UUID!]!
  usersAffected: Int
  revenueAtRiskPerHour: Money
  slaBudgetRemainingMinutes: Float
  recovery: Recovery
}
type Recovery {
  description: String!
  estimatedMinutes: Int!
}
type Money {
  amount: Float!
  currency: String!
}

type ImpactScenario {
  id: UUID!
  name: String!
  kind: String!
  "user: a saved what-if model; incident: the replay of a real incident's root cause (ADR-047)."
  origin: String!
  "The procedure to follow if this scenario happens for real (ADR-048)."
  runbook: Runbook
  failedCis: [Ci!]!
  options: JSON!
  createdBy: String!
  createdAt: DateTime!
}
type ImpactSimulation {
  id: UUID!
  scenario: ImpactScenario!
  ranAt: DateTime!
  durationMs: Int!
  failedCis: [Ci!]!
  affectedApplications: [Ci!]!
  services: [AffectedService!]!
  totals: ImpactTotals!
  recommendations: [Recommendation!]!
}
"A resolved incident compared with the simulation of its root cause (REQ-BSM-004, ADR-047)."
type ImpactValidation {
  id: UUID!
  incident: Incident!
  simulation: ImpactSimulation!
  rootCause: Ci
  predictedServices: [Ci!]!
  actualServices: [Ci!]!
  "Services the incident hit that the simulation did not predict."
  missedServices: [Ci!]!
  "Services the simulation predicted that the incident spared."
  unexpectedServices: [Ci!]!
  "Jaccard similarity of predicted and actual services, 0..1."
  accuracy: Float!
  validatedAt: DateTime!
}
"Prediction accuracy over a tenant's validated incidents."
type ImpactAccuracy {
  validated: Int!
  "Mean accuracy of the validated incidents; null before the first."
  meanAccuracy: Float
  "Validations whose prediction matched the incident exactly."
  exact: Int!
  "Resolved incidents with a root cause that are not validated yet."
  pending: Int!
  "Resolved incidents the sweep cannot compare because they name no root cause."
  withoutRootCause: Int!
  recent: [ImpactValidation!]!
}
"A DNS zone kept in sync both ways (REQ-IPAM-003, ADR-055): transferred from its server and updated through it."
type DnsZoneSync {
  id: UUID!
  zone: String!
  "The authoritative server the zone is transferred from and changes are pushed to."
  server: String!
  port: Int!
  tsigKeyName: String
  tsigAlgorithm: String
  "The credential holding the TSIG secret."
  credentialRef: String
  "The site whose Discovery Node reaches the server."
  siteId: UUID!
  enabled: Boolean!
  lastPullAt: DateTime
  lastPushAt: DateTime
  lastError: String
  "Changes not settled yet (pending or sent)."
  pending: Int!
}
"A record change requested in OpenMap and its progress to the server (REQ-IPAM-003)."
type DnsChange {
  id: UUID!
  zone: String!
  "add or delete."
  op: String!
  "The record name, absolute within the zone."
  name: String!
  recordType: String!
  value: String!
  ttl: Int!
  "pending, sent, applied or failed."
  state: String!
  error: String
  requestedBy: String!
  requestedAt: DateTime!
  settledAt: DateTime
}
input DnsZoneSyncInput {
  zone: String!
  server: String!
  port: Int
  tsigKeyName: String
  tsigAlgorithm: String
  credentialRef: String
  siteId: UUID!
  enabled: Boolean
}
input DnsChangeInput {
  zone: String!
  "add or delete."
  op: String!
  name: String!
  "A, AAAA, CNAME, TXT, PTR, MX, SRV or NS."
  recordType: String!
  value: String!
  ttl: Int
}
"A recommendation for one cloud resource (REQ-AI-005, ADR-054), with the figures it rests on."
type CloudRecommendation {
  ci: Ci!
  "release_stopped, decommission_idle, downsize or upsize."
  kind: String!
  "Estimated monthly saving in USD; 0 for an upsize."
  savingUsd: Float!
  "Average and peak load in percent over the samples read; null without any."
  averageLoad: Float
  peakLoad: Float
  samples: Int!
  "When the newest load sample was taken."
  loadAt: DateTime
  sku: String
  state: String
  monthlyCostUsd: Float
  owner: String
  environment: String
}
type CloudAdvice {
  "Recommendations, the largest saving first."
  items: [CloudRecommendation!]!
  "Cloud resources the model looked at."
  resources: Int!
  monthlySavingUsd: Float!
  asOf: DateTime!
}
"One fact behind an anomaly finding (REQ-AI-003): what the rule found, by key."
type AnomalyFact {
  key: String!
  value: String!
}
"A finding of an anomaly rule over discovery and health events (REQ-AI-003, ADR-053)."
type AnomalyFinding {
  id: UUID!
  "ip_conflict, unmanaged_device_in_datacenter or flapping_service."
  rule: String!
  "The address, the device or the service the finding is about."
  subject: Ci
  facts: [AnomalyFact!]!
  "open or cleared."
  state: String!
  detectedAt: DateTime!
  lastSeenAt: DateTime!
  clearedAt: DateTime
  "The model's explanation, once asked for (explainAnomaly), in explanationLocale."
  explanation: String
  explanationLocale: String
}
type AnomalyReport {
  "Open findings, then those cleared in the last week, newest first."
  findings: [AnomalyFinding!]!
  open: Int!
  "When this API instance last evaluated the rules for the tenant."
  lastSweepAt: DateTime
}
"One piece of evidence behind a classification (REQ-AI-002): which signal matched, what it matched, its weight."
type ClassificationEvidence {
  "sysDescr, banner, vendor or ports."
  signal: String!
  value: String!
  weight: Float!
}
"A suggested class, layer and type for a CI discovery could only call unknown (REQ-AI-002, ADR-052)."
type ClassificationSuggestion {
  id: UUID!
  ci: Ci!
  "The device class the evidence points at, e.g. printer, network_camera, ups_management."
  deviceClass: String!
  layer: CiLayer!
  "The CMDB type, where one fits; null keeps the CI's type and labels its layer."
  type: String
  "The label's title and description that accepting writes."
  title: String!
  description: String!
  "0 to 1: the summed weight of the evidence."
  confidence: Float!
  evidence: [ClassificationEvidence!]!
  "open, accepted or dismissed."
  state: String!
  decidedBy: String
  decidedAt: DateTime
  createdAt: DateTime!
}
type ClassificationSummary {
  "Open suggestions, highest confidence first."
  open: [ClassificationSuggestion!]!
  "Unknown, unlabelled CIs no fingerprint recognised."
  unrecognised: Int!
  accepted: Int!
  dismissed: Int!
  "accepted / (accepted + dismissed); null before any decision."
  acceptanceRate: Float
}
"A relationship the graph may be missing: an incident caused by `from` hit the service `to`, and no modelled path reached it."
type RelationshipSuggestion {
  id: UUID!
  type: String!
  from: Ci!
  to: Ci!
  reason: String!
  occurrences: Int!
  lastIncident: Incident
  state: String!
  decidedBy: String
  decidedAt: DateTime
  relationship: Relationship
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ImpactTotals {
  servicesDown: Int!
  servicesDegraded: Int!
  usersAffected: Int!
  revenueAtRiskPerHour: Money
}
type Recommendation {
  title: String!
  rationale: String!
  estimatedMinutes: Int
}

# REQ-BSM-006 REQ-BSM-008 (ADR-024) — SLAs, availability by period and incident response with RCA.
enum SlaWindow {
  calendar_month
  calendar_quarter
  calendar_year
  rolling_30d
}
enum AvailabilityGranularity {
  month
  quarter
  year
}
enum IncidentSeverity {
  informational
  low
  medium
  high
  critical
}
enum IncidentState {
  open
  acknowledged
  mitigated
  resolved
  closed
}
type SeverityTarget {
  severity: IncidentSeverity!
  respondMinutes: Int!
  resolveMinutes: Int!
}
type Sla {
  id: UUID!
  name: String!
  description: String!
  availabilityTargetPercent: Float!
  window: SlaWindow!
  """
  Targets for every severity: the SLA's own where it names one, the platform defaults elsewhere.
  """
  responseTargets: [SeverityTarget!]!
  burnRateAlert: Float!
  services: [Ci!]!
  createdBy: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}
"""
One calendar period (in the tenant's time zone) or SLA window of a service's availability.
"""
type AvailabilityPeriod {
  granularity: AvailabilityGranularity
  year: Int!
  month: Int
  quarter: Int
  periodStart: DateTime!
  periodEnd: DateTime!
  """
  True while the period is still running; figures run to now.
  """
  current: Boolean!
  """
  Null when the service was not observed at all in the period.
  """
  availabilityPercent: Float
  elapsedMinutes: Float!
  downtimeMinutes: Float!
  degradedMinutes: Float!
  unknownMinutes: Float!
  targetPercent: Float
  """
  Whether availability meets the target; null without a target or a figure.
  """
  met: Boolean
  budgetMinutes: Float
  budgetRemainingMinutes: Float
  burnRate: Float
  """
  Incidents of the service that were open during the period.
  """
  incidents: [Incident!]!
}
type ServiceAvailability {
  service: Ci!
  sla: Sla
  periods: [AvailabilityPeriod!]!
}
type ServiceHealth {
  service: Ci!
  state: HealthState!
  since: DateTime!
  rootCauses: [Ci!]!
  slaTarget: Float!
  errorBudgetRemainingMinutes: Float!
  sla: Sla
  """
  The SLA's current window (or the rolling 30 days without an SLA).
  """
  currentWindow: AvailabilityPeriod!
  availability(granularity: AvailabilityGranularity!, periods: Int): [AvailabilityPeriod!]!
}
type CorrectiveAction {
  description: String!
  owner: String
  dueAt: DateTime
  done: Boolean!
}
type Rca {
  summary: String!
  rootCauseCi: Ci
  contributingFactors: [String!]!
  correctiveActions: [CorrectiveAction!]!
  owner: String
  dueAt: DateTime
  completedAt: DateTime
  updatedBy: String!
  updatedAt: DateTime!
}
"""
One step of an incident's history: engine events and people's actions, oldest first.
"""
type IncidentEvent {
  at: DateTime!
  actor: String!
  kind: String!
  details: JSON!
}
"""
REQ-CMDB-041 — one page of the register with its totals, for page controls (page numbers start at 1).
"""
type AssetPage {
  items: [AssetRecord!]!
  totalCount: Int!
  page: Int!
  pageSize: Int!
  pageCount: Int!
}
type Incident {
  id: UUID!
  title: String!
  description: String!
  severity: IncidentSeverity!
  state: IncidentState!
  source: String!
  service: Ci!
  sla: Sla
  openedAt: DateTime!
  acknowledgedAt: DateTime
  resolvedAt: DateTime
  closedAt: DateTime
  assignee: String
  respondBy: DateTime
  resolveBy: DateTime
  responseBreachedAt: DateTime
  resolutionBreachedAt: DateTime
  resolutionNote: String
  rootCause: Ci
  alerts: Int!
  links: [IncidentLink!]!
  rca: Rca
  timeline: [IncidentEvent!]!
  "The runbook an operator attached (REQ-BSM-005, ADR-048)."
  runbook: Runbook
  "When none is attached: the runbook of the saved scenario of the incident's root cause, if any."
  suggestedRunbook: Runbook
  "Every step run on this incident, oldest first."
  runbookRuns: [RunbookStepRun!]!
  "The attached runbook's estimate, the sum of its step minutes."
  recoveryEstimateMinutes: Int
  "Minutes of the steps whose latest run is neither done nor triggered."
  recoveryRemainingMinutes: Int
}
"Sites, inter-site links with their latest probes, and the HA / DR readiness findings (REQ-BSM-007, ADR-025)."
type Connectivity {
  sites: [ConnectivitySite!]!
  links: [ConnectivityLink!]!
  "Open findings, then those cleared in the last READINESS window, newest first."
  findings: [ReadinessFinding!]!
  "How often links are probed; 0 when probing is off."
  probeIntervalSeconds: Int!
}
type ConnectivitySite {
  ci: Ci!
  code: String!
  "primary, dr or none."
  drRole: String!
  criticality: Int
  "Healthy paths: healthy links touching the site, counting each link's diverse paths."
  healthyPaths: Int!
  "Site kind (datacenter, colocation, office, branch_bundle, cloud_region …); REQ-UI-026."
  kind: String
  "Uptime Institute tier, 1 to 4; null when the site has none."
  tier: Int
  powerCapacityKw: Float
  designPue: Float
  "Latest measured PUE and when it was taken; null when the site reports none."
  pue: Float
  pueAt: DateTime
  "Racks in the site's facility tree (building, room, row, rack)."
  racks: Int!
  "Open readiness findings on the site or its links, plus unresolved incidents whose root cause is located in the site."
  openAlerts: Int!
}
"Redundancy between a link's two sites, over every link joining them (REQ-UI-026)."
enum LinkRedundancy {
  active_active
  active_standby
  degraded
  down
  single_path
}
type ConnectivityLink {
  ci: Ci!
  fromSite: String
  toSite: String
  kind: String
  provider: String
  role: String
  replication: Boolean!
  diversePaths: Int!
  probeTarget: String
  "From the latest probe; null when the link has not been probed."
  reachable: Boolean
  latencyMs: Float
  lossPercent: Float
  probedAt: DateTime
  slaLatencyMs: Int
  "Committed bandwidth; null when the link records none (REQ-UI-026)."
  capacityMbps: Int
  "Latest measured traffic; null when the link reports none."
  throughputMbps: Float
  "Traffic as a share of the committed bandwidth; null without both."
  utilisationPercent: Float
  redundancy: LinkRedundancy!
}
type ReadinessFinding {
  id: UUID!
  "diverse_paths, dr_reachable or replication_healthy."
  rule: String!
  subject: Ci
  detail: String!
  "open or cleared."
  state: String!
  openedAt: DateTime!
  clearedAt: DateTime
  incident: Incident
}
"A procedure in the tenant's catalogue, attached to scenarios and incidents (REQ-BSM-005, ADR-048)."
type Runbook {
  id: UUID!
  code: String!
  title: String!
  ownerTeam: String!
  "ISO calendar date (YYYY-MM-DD)."
  lastReviewedAt: String
  steps: [RunbookStep!]!
  "Sum of the steps' estimated minutes; null when no step has one."
