input LabelCiInput {
  ciId: UUID!
  title: String!
  description: String!
  layer: CiLayer!
  type: String
}
input ScenarioInput {
  name: String!
  kind: String!
  failedCiIds: [UUID!]!
  maxDepth: Int = 0
  honourRedundancy: Boolean = true
  includeSharedServices: Boolean = true
  at: DateTime
  runbookId: UUID
}
input PlanInput {
  name: String!
  description: String!
  kind: String!
  targetSiteId: UUID
  targetRackIds: [UUID!]
  bom: [BomLineInput!]!
  plannedLiveAt: DateTime
}
input FleetFilter {
  "Categories; every layer with telemetry when absent."
  layers: [CiLayer!]
  health: [HealthState!]
  "Matches the name, the address or the site."
  text: String
}
input UtilisationFilter {
  "CI types, e.g. host, vm, pdu; all types with utilisation when absent."
  types: [String!]
  state: UtilisationState
  "Matches the CI's name."
  text: String
}
input LifecycleReleaseFilter {
  kind: LifecycleKind
  state: LifecycleState
  "Matches the release label, product, a version or the name of a CI on it."
  text: String
}
input LifecycleHardwareFilter {
  state: LifecycleState
  "Matches manufacturer or model."
  text: String
}
input ComponentFilter {
  kind: ComponentKind
  "Matches model, manufacturer, serial number, part number, slot or the parent CI's name."
  text: String
  includeRemoved: Boolean
}
input CertificateFilter {
  text: String
  expiringWithinDays: Int
  expired: Boolean
  selfSigned: Boolean
  weak: Boolean
  "Certificate authorities in discovered chains are left out unless asked for."
  includeAuthorities: Boolean
}
input ContractFilter {
  kinds: [ContractKind!]
  vendorId: UUID
  costCentreId: UUID
  text: String
  expiringWithinDays: Int
  expired: Boolean
}
input ContractDocumentInput {
  title: String!
  location: String!
}
"Dates are calendar dates (YYYY-MM-DD); the vendor's name and the contract number identify the contract."
input ContractInput {
  vendorId: UUID!
  costCentreId: UUID
  contractNumber: String!
  kind: ContractKind!
  title: String!
  level: String
  responseMinutes: Int
  startsAt: String!
  endsAt: String!
  autoRenews: Boolean!
  noticeDays: Int
  annualCost: Float
  currency: String
  documents: [ContractDocumentInput!]!
}
input VendorInput {
  name: String!
  category: String
  supportPortal: String
  accountManager: String
}
input CostCentreInput {
  code: String!
  name: String!
  kind: CostCentreKind!
  owner: String
  annualBudget: Float
  currency: String
}
input VendorContactInput {
  id: UUID
  vendorId: UUID!
  name: String!
  role: String!
  email: String
  phone: String
  portalUrl: String
  availability: String
  escalationLevel: Int!
}
"One unit taken into stock: its serial and, when the organisation labels on arrival, its asset tag."
input ReceivedUnitInput {
  serialNumber: String!
  assetTag: String
}
"REQ-CMDB-020 (ADR-034): a delivery against one BOM line of an approved or building plan."
input ReceiptInput {
  planId: UUID!
  position: Int!
  "Calendar date the goods arrived (YYYY-MM-DD)."
  receivedOn: String!
  reference: String
  locationId: UUID
  units: [ReceivedUnitInput!]!
}
input BomLineInput {
  description: String!
  manufacturer: String
  model: String
  sku: String
  layer: CiLayer!
  quantity: Int!
  unitCostAmount: Float
  unitCostCurrency: String
}
input AssetFilter {
  layers: [CiLayer!]
  types: [String!]
  stages: [AssetStage!]
  sources: [AssetSource!]
  dataGaps: [AssetDataGap!]
  text: String
  warrantyExpiringWithinDays: Int
  """
  Only stocked spares at or below their reorder point (REQ-CMDB-019).
  """
  belowReorderPoint: Boolean
}
"""
Dates are calendar dates (YYYY-MM-DD).
"""
input WarrantyInput {
  provider: String!
  level: String
  startsAt: String
  endsAt: String!
}
"""
Dates are calendar dates; creditsRemaining needs creditsUnit (and an optional ISO 4217 creditsCurrency).
"""
input SubscriptionInput {
  provider: String!
  plan: String
  startsAt: String
  endsAt: String
  creditsRemaining: Float
  creditsUnit: String
  creditsCurrency: String
}
input SupportInput {
  provider: String!
  contractNumber: String
  level: String
  endsAt: String!
}
input EndOfLifeInput {
  endOfSale: String
  endOfSoftwareMaintenance: String
  endOfSupport: String
}
"""
REQ-CMDB-017: method is straight_line, declining_balance or none; the residual is in the purchase currency.
"""
input DepreciationInput {
  method: String!
  usefulLifeMonths: Int!
  residualValueAmount: Float!
}
input StockInput {
  onHand: Int!
  reorderPoint: Int!
}
"""
Fields a person records on an asset; every change is audited per field. A null object clears that cover.
"""
input AssetDetailsInput {
  manufacturer: String
  model: String
  serialNumber: String
  partNumber: String
  custodian: String
  "ADR-035: a cost_centre CI; null clears the owner."
  ownerCostCentreId: UUID
  purchasedAt: String
  purchaseCostAmount: Float
  purchaseCostCurrency: String
  warranty: WarrantyInput
  subscription: SubscriptionInput
  support: SupportInput
  endOfLife: EndOfLifeInput
  depreciation: DepreciationInput
  stock: StockInput
  note: String
}
"""
An asset with no network presence (an unmetered PDU, a device without out-of-band management): a CI of the chosen type is created with it.
"""
input ManualAssetInput {
  layer: CiLayer!
  type: String!
  name: String!
  assetTag: String
  locationCiId: UUID
  details: AssetDetailsInput!
}
input IntegrationInput {
  category: String!
  vendor: String!
  name: String!
  endpoint: String!
  credentialRef: String!
  direction: String!
  settings: JSON
  fieldMappings: JSON
  classMappings: JSON
  subscribedEvents: [String!]
}
input SeverityTargetInput {
  severity: IncidentSeverity!
  respondMinutes: Int!
  resolveMinutes: Int!
}
input SlaInput {
  name: String!
  description: String
  availabilityTargetPercent: Float!
  window: SlaWindow!
  responseTargets: [SeverityTargetInput!]
  burnRateAlert: Float
}
input CorrectiveActionInput {
  description: String!
  owner: String
  dueAt: DateTime
  done: Boolean
}
input RcaInput {
  summary: String!
  rootCauseCiId: UUID
  contributingFactors: [String!]
  correctiveActions: [CorrectiveActionInput!]
  owner: String
  dueAt: DateTime
  completedAt: DateTime
}

type Mutation {
  "REQ-CMDB-023 (ADR-039): refreshes the lifecycle catalogue; admin only, refused unless outbound calls are allowed."
  syncLifecycleCatalogue: LifecycleSyncResult!
  createDashboard(input: DashboardInput!): Dashboard!
  updateDashboard(id: UUID!, input: DashboardInput!): Dashboard!
  deleteDashboard(id: UUID!): Boolean!
  setDefaultDashboard(id: UUID!): Dashboard!
  labelCi(input: LabelCiInput!): Ci!
  updateCiAttributes(ciId: UUID!, attributes: JSON!): Ci!
  """
  Rename a CI's short code; the new code must match the code pattern and be free within the tenant.
  """
  setCiCode(ciId: UUID!, code: String!): Ci!
  """
  Moves a CI through its lifecycle (discovered, managed, planned, retired) by hand; discovery keeps what a person set (REQ-CMDB-013).
  """
  setCiLifecycle(ciId: UUID!, lifecycle: Lifecycle!): Ci!
  """
  Replaces a CI's tags; tags a collector observes again are merged back on its next sweep (REQ-CMDB-016).
  """
  setCiTags(ciId: UUID!, tags: [String!]!): Ci!
  """
  Sets custom field values on a CI; null clears a value; each value is checked against its definition (REQ-CMDB-015).
  """
  setCiCustomFields(ciId: UUID!, values: JSON!): Ci!
  """
  Reads an import file with a mapping and says what would be queued and what refused; writes nothing (REQ-CMDB-033).
  """
  previewImport(input: ImportInput!): ImportPreview!
  """
  Queues an import's observations for the reconciler as the import source (REQ-CMDB-033, REQ-CMDB-036).
  """
  runImport(input: ImportInput!): ImportJob!
  """
  Creates or changes a custom field definition (administrators); the key cannot change once created.
  """
  upsertCustomFieldDefinition(id: UUID, input: CustomFieldDefinitionInput!): CustomFieldDefinition!
  """
  Removes a definition and clears its values from every CI (administrators).
  """
  deleteCustomFieldDefinition(id: UUID!): Boolean!
  createRelationship(type: String!, fromCiId: UUID!, toCiId: UUID!, attributes: JSON): Relationship!
  retireRelationship(id: UUID!): Relationship!
  setLayerVisibility(layer: CiLayer!, visible: Boolean!): [LayerSummary!]!
  runDiscovery(collectorIds: [String!], siteId: UUID): Sweep!
  updateDiscoveryScope(ciId: UUID!, input: DiscoveryScopeInput!): DiscoveryScope!
  saveScenario(input: ScenarioInput!): ImpactScenario!
  runSimulation(scenarioId: UUID!): ImpactSimulation!
  "Validates resolved incidents that are not validated yet, up to limit, and returns the accuracy (REQ-BSM-004)."
  validateImpactPredictions(limit: Int = 50): ImpactAccuracy!
  "Compares one resolved incident that names a root cause with a simulation of it, again if it was validated before."
  validateImpactPrediction(incidentId: UUID!): ImpactValidation!
  "Creates the suggested relationship and marks the suggestion accepted."
  acceptRelationshipSuggestion(id: UUID!): RelationshipSuggestion!
  "REQ-AI-002: writes the suggestion as the CI's user label (layer, type, title, description)."
  acceptClassificationSuggestion(id: UUID!): ClassificationSuggestion!
  dismissClassificationSuggestion(id: UUID!): ClassificationSuggestion!
  "REQ-AI-003: evaluates the anomaly rules now (they also run every ANOMALY_INTERVAL_MS)."
  detectAnomalies: AnomalyReport!
  "REQ-AI-003: the local model's explanation of a finding, from its facts only."
  explainAnomaly(id: UUID!, locale: String!): AnomalyFinding!
  "REQ-IPAM-003: keeps a zone in sync with its authoritative server."
  upsertDnsZoneSync(input: DnsZoneSyncInput!): DnsZoneSync!
  "REQ-IPAM-003: a record to add or delete on the zone's server; it is pushed with the zone's next sync job."
  requestDnsChange(input: DnsChangeInput!): DnsChange!
  "REQ-DCIM-005: sets the power lines and tariff (administrators)."
  updatePowerSettings(input: PowerSettingsInput!): PowerSettings!
  "REQ-DCIM-004: records a device cord on a PDU outlet (the outlet must be free)."
  connectPower(input: PowerConnectionInput!): PowerConnection!
  "REQ-DCIM-004: removes a device cord from its PDU."
  disconnectPower(id: UUID!): Boolean!
  "REQ-DCIM-003: moves a rack to a slot (position) of a row in its own room."
  placeRack(rackId: UUID!, rowId: UUID!, position: Int!): Rack!
  "REQ-DCIM-001: mounts a patch panel in a rack, or updates one (id)."
  upsertPatchPanel(id: UUID, input: PatchPanelInput!): PatchPanel!
  "REQ-DCIM-001: connects a cable between two ports; a port takes one cable."
  connectCable(input: CableInput!): Cable!
  "REQ-DCIM-001: removes a cable (the CI is retired with its two ends)."
  disconnectCable(id: UUID!): Boolean!
  "REQ-DCIM-001: records a carrier circuit with its terminations, or updates one (id)."
  upsertCircuit(id: UUID, input: CircuitInput!): Circuit!
  "REQ-DCIM-001: removes a patch panel with no cable or circuit on it (its CI is retired)."
  removePatchPanel(id: UUID!): Boolean!
  "REQ-DCIM-001: removes a circuit (its CI is retired with its terminations)."
  removeCircuit(id: UUID!): Boolean!
  "Marks the suggestion dismissed; the same miss is not suggested again."
  dismissRelationshipSuggestion(id: UUID!): RelationshipSuggestion!
  "Creates a runbook (id omitted) or replaces one (REQ-BSM-005, ADR-048)."
  upsertRunbook(id: UUID, input: RunbookInput!): Runbook!
  "Deletes a runbook; scenarios and incidents that named it keep no runbook."
  deleteRunbook(id: UUID!): Boolean!
  setScenarioRunbook(scenarioId: UUID!, runbookId: UUID): ImpactScenario!
  setIncidentRunbook(incidentId: UUID!, runbookId: UUID): Incident!
  "Runs one step of the incident's runbook: a manual step is marked done, an automated one is triggered."
  runRunbookStep(incidentId: UUID!, order: Int!, note: String): RunbookStepRun!
  createPlan(input: PlanInput!): InfraPlan!
  setPlanStatus(planId: UUID!, status: PlanStatus!): InfraPlan!
  receivePlanLine(input: ReceiptInput!): PlanReceipt!
  upsertContract(id: UUID, input: ContractInput!): Contract!
  upsertVendor(id: UUID, input: VendorInput!): Vendor!
  upsertCostCentre(id: UUID, input: CostCentreInput!): CostCentre!
  upsertVendorContact(input: VendorContactInput!): VendorContact!
  deleteVendorContact(id: UUID!): Boolean!
  setAssetContract(assetId: UUID!, contractId: UUID): AssetRecord!
  setAssetStage(assetId: UUID!, stage: AssetStage!, note: String): AssetRecord!
  updateAsset(assetId: UUID!, input: AssetDetailsInput!): AssetRecord!
  createAsset(input: ManualAssetInput!): AssetRecord!
  upsertIntegration(id: UUID, input: IntegrationInput!): Integration!
  testIntegration(id: UUID!): Integration!
  "REQ-INT-009: queues a test message on a notification integration (webhook, Slack, Teams, email, PagerDuty); the outcome appears in its deliveries."
  sendTestNotification(id: UUID!): Boolean!
  reportIncident(incidentId: UUID!, integrationId: UUID!): IncidentLink!
  acknowledgeIncident(incidentId: UUID!): Incident!
  assignIncident(incidentId: UUID!, assignee: String!): Incident!
  resolveIncident(incidentId: UUID!, note: String!): Incident!
  closeIncident(incidentId: UUID!): Incident!
  updateIncidentRca(incidentId: UUID!, input: RcaInput!): Incident!
  upsertSla(id: UUID, input: SlaInput!): Sla!
  """
  Removes an SLA; its services lose their assignment and fall back to the slaTargetPercent attribute.
  """
  deleteSla(id: UUID!): Boolean!
  """
  Holds a business service to an SLA; a null slaId clears the assignment.
  """
  assignSla(serviceId: UUID!, slaId: UUID): ServiceHealth!
  """
  Answers in `locale` (en or ar; the tenant's locale when omitted) over Postgres, Memgraph and ClickHouse.
  """
  askAssistant(question: String!, locale: String, conversationId: UUID): AssistantAnswer!
  deleteConversation(id: UUID!): Boolean!
  updateTenantSettings(input: TenantSettingsInput!): TenantSettings!
  updateOrganization(input: OrganizationInput!): Organization!
  upsertSite(id: UUID, input: SiteInput!): Site!
  """
  Removes a site that has no Node and no link; its CI is retired.
  """
  removeSite(id: UUID!): Boolean!
  upsertSiteLink(id: UUID, input: SiteLinkInput!): SiteLink!
  removeSiteLink(id: UUID!): Boolean!
  """
  Registers (or re-registers) a Discovery Node for a site and returns its one-time enrolment token.
  """
  registerNode(siteId: UUID!, nodeId: String!): NodeRegistration!
  """
  Writes a credential set to the vault under `ref`; the API keeps the reference only.
  """
  saveCredentialSet(input: CredentialSetInput!): CredentialSet!
  """
  Creates a subnet CI at a site as a discovery scope, through the outbox like any CI.
  """
  addDiscoveryScope(input: ScopeInput!): DiscoveryScope!
  setOnboardingStep(step: OnboardingStep!, completed: Boolean!): OnboardingState!
  """
  Creates the CIs the twin still lacks (links), records the generation and starts the first sweep.
  """
  generateTwin: OnboardingState!
}

type Subscription {
  events(types: [String!]): JSON!
  serviceHealthChanged: ServiceHealth!
  sweepProgress: Sweep!
}
