  text
  number
  date
  boolean
  select
}
type CustomFieldDefinition {
  id: UUID!
  key: String!
  labelEn: String!
  labelAr: String!
  description: String!
  type: CustomFieldType!
  options: [String!]!
  """
  CI types the field applies to; empty means every type.
  """
  appliesTo: [String!]!
  required: Boolean!
