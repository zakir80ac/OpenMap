  """
  kind: String!
  """
  Interface pairs (L2) or addresses (L3) the link aggregates.
  """
  count: Int!
  ports: [String!]!
  protocols: [String!]!
  media: [String!]!
  speedMbps: Float
}
type NetworkTopology {
  layer: TopologyLayer!
  nodes: [TopologyNode!]!
  links: [TopologyLink!]!
  """
  True when the map hit the node cap and was cut.
  """
  truncated: Boolean!
  durationMs: Int!
}

