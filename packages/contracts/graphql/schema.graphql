# REQ-CMDB-023 REQ-CMDB-025 (ADR-039): the product lifecycle catalogue and what the estate runs against it.
enum LifecycleKind {
  os
  hypervisor
  network_os
  database
  platform
  hardware
}
"supported; ending inside the deployment's horizon; ended; unknown when the catalogue has no date."
enum LifecycleState {
  supported
  ending
  ended
  unknown
}
"One release as the catalogue records it; dates are calendar dates (YYYY-MM-DD)."
type LifecycleEntry {
  source: String!
  product: String!
  cycle: String!
  label: String!
  releaseDate: String
  "End of active support."
  supportEnd: String
