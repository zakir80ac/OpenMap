  subnets(parentId: UUID): [Subnet!]!
  nextFreeIp(subnetId: UUID!): String
  "REQ-IPAM-004: a device's ports with state, VLAN, neighbour, learned MACs and how long a down port has not been up."
  switchPorts(deviceId: UUID!): SwitchPorts!
  "REQ-IPAM-004: the changes between a port's recorded versions over the last days (default SWITCH_PORTS.historyDays)."
