  headers: [String!]!
  mapping: JSON!
  rows: Int!
  accepted: Int!
  rejected: Int!
  rejectedRows: [RejectedRow!]!
  byType: JSON!
  """
  The first rows as read, for the mapping screen.
  """
  sample: [[String!]!]!
}
type ImportJob {
  id: UUID!
  filename: String!
  format: ImportFormat!
  rows: Int!
  accepted: Int!
  rejected: Int!
  rejectedRows: [RejectedRow!]!
  byType: JSON!
  runId: UUID!
  """
  Current CIs the import created (their provenance is this run).
  """
