# REQ-CORE-006 — OpenMap GraphQL contract, version 1.0.0 (see docs/CONTRACTS.md). Checked by `pnpm contracts:check`.
# Served by apps/api (Mercurius). Breaking changes require an ADR and a tracker row.

scalar DateTime
scalar JSON
scalar UUID

enum CiLayer { dc network_security hardware storage virtualization cloud os containers databases applications saas unknown }
enum Lifecycle { discovered managed planned retired }
enum HealthState { healthy degraded down unknown }
enum PredictedState { down degraded at_risk unaffected }
enum AssetStage { planned in_stock deployed spare rma retired disposed }
enum AssetSource { plan discovery manual }
enum AssetDataGap { warranty support end_of_life }
enum PlanStatus { draft approved building live cancelled }
enum IntegrationHealth { healthy warning failing disabled }
enum Direction { upstream downstream both }

type Provenance { collectorId: String! nodeId: String! runId: String! confidence: Float! }
type ExternalId { source: String! id: String! }
type UserLabel { title: String! description: String! layer: CiLayer! type: String labelledBy: String! labelledAt: DateTime! }

type Ci {
  id: UUID!
  tenantId: UUID!
  type: String!
  layer: CiLayer!
  name: String!
  displayName: String!
  """Short code spoken in incidents and printed on cards (layer prefix plus slug); unique per tenant, editable by operators."""
  code: String!
  identity: JSON!
  attributes: JSON!
  tags: [String!]!
  externalIds: [ExternalId!]!
  lifecycle: Lifecycle!
  userLabel: UserLabel
  source: Provenance!
  observedAt: DateTime!
  validFrom: DateTime!
  validTo: DateTime
  health: HealthState!
  """The layer's headline measurement (ADR-016): the latest ClickHouse sample of the metric LAYER_HEADLINE_METRIC names for the CI's layer; value and observedAt are null until a collector has sampled it. For the unknown layer the value is the days since the CI was last observed."""
  headlineMetric: HeadlineMetric!
  relationships(direction: Direction = both, types: [String!], first: Int = 50, after: String): RelationshipConnection!
  asset: AssetRecord
  vulnerabilities: [Vulnerability!]!
  history(from: DateTime, to: DateTime): [CiVersion!]!
}

type CiVersion { validFrom: DateTime! validTo: DateTime attributes: JSON! lifecycle: Lifecycle! source: Provenance! }

"""One headline measurement: key and label from the contract's LAYER_HEADLINE_METRIC, unit as printed after the value, metric as stored in ClickHouse."""
type HeadlineMetric { key: String! label: String! unit: String! metric: String! value: Float observedAt: DateTime }

type Relationship {
  id: UUID!
  type: String!
  from: Ci!
  to: Ci!
  attributes: JSON!
  source: Provenance!
  validFrom: DateTime!
  validTo: DateTime
}

type PageInfo { endCursor: String hasNextPage: Boolean! }
type CiEdge { cursor: String! node: Ci! }
type CiConnection { edges: [CiEdge!]! pageInfo: PageInfo! totalCount: Int! }
type RelationshipEdge { cursor: String! node: Relationship! }
type RelationshipConnection { edges: [RelationshipEdge!]! pageInfo: PageInfo! totalCount: Int! }

input CiFilter {
  types: [String!]
  layers: [CiLayer!]
  lifecycle: [Lifecycle!]
  tags: [String!]
  siteId: UUID
  text: String
  attributeEquals: JSON
  health: [HealthState!]
  asOf: DateTime
}

type ImpactNode { ci: Ci! depth: Int! predicted: PredictedState! path: [UUID!]! }
type ImpactResult {
  root: Ci!
  nodes: [ImpactNode!]!
  services: [AffectedService!]!
  durationMs: Int!
}
type AffectedService {
  service: Ci!
  tier: Int!
  predicted: PredictedState!
  path: [UUID!]!
  usersAffected: Int
  revenueAtRiskPerHour: Money
  slaBudgetRemainingMinutes: Float
  recovery: Recovery
}
type Recovery { description: String! estimatedMinutes: Int! }
type Money { amount: Float! currency: String! }

type ImpactScenario { id: UUID! name: String! kind: String! failedCis: [Ci!]! options: JSON! createdBy: String! createdAt: DateTime! }
type ImpactSimulation {
  id: UUID!
  scenario: ImpactScenario!
  ranAt: DateTime!
  durationMs: Int!
  failedCis: [Ci!]!
  affectedApplications: [Ci!]!
  services: [AffectedService!]!
  totals: ImpactTotals!
  recommendations: [Recommendation!]!
}
type ImpactTotals { servicesDown: Int! servicesDegraded: Int! usersAffected: Int! revenueAtRiskPerHour: Money }
type Recommendation { title: String! rationale: String! estimatedMinutes: Int }

type ServiceHealth { service: Ci! state: HealthState! since: DateTime! rootCauses: [Ci!]! slaTarget: Float! errorBudgetRemainingMinutes: Float! }
type Incident { id: UUID! service: Ci! openedAt: DateTime! resolvedAt: DateTime rootCause: Ci alerts: Int! links: [IncidentLink!]! }
type IncidentLink { integration: Integration! remoteId: String! remoteUrl: String remoteState: String! syncedAt: DateTime! }

type Subnet { ci: Ci! cidr: String! vrf: String utilisationPercent: Float! addresses(first: Int = 100, after: String): CiConnection! children: [Subnet!]! }
type Rack { ci: Ci! units: Int! occupiedUnits: Int! devices: [RackDevice!]! powerFeeds: [PowerFeed!]! row: Ci room: Ci }
type RackDevice { ci: Ci! startUnit: Int! heightUnits: Int! face: String! }
type PowerFeed { ci: Ci! ratedWatts: Int! currentWatts: Int! }

# REQ-CMDB-039 REQ-CMDB-040 (ADR-023) — the register: one row per owned CI (discovery), per BOM unit (plan) or per
# manual entry; warranty, support and end-of-life carried on the row, the missing ones listed as dataGaps.
type AssetRecord {
  id: UUID!
  ci: Ci
  """The CI's type at creation; null for a planned asset with no CI yet."""
  ciType: String
  layer: CiLayer!
  source: AssetSource!
  assetTag: String!
  serialNumber: String
  manufacturer: String
  model: String
  partNumber: String
  stage: AssetStage!
  stageChangedAt: DateTime!
  custodian: String
  locationCi: Ci
  purchasedAt: DateTime
  purchaseCost: Money
  warranty: Warranty
  warrantyEndsAt: DateTime
  support: Support
  supportContract: SupportContract
  """The support end date from the row's own support entry or its support contract, whichever is set."""
  supportEndsAt: DateTime
  endOfLife: EndOfLife
  endOfSupport: DateTime
  dataGaps: [AssetDataGap!]!
  plan: InfraPlan
  audits: [AssetAudit!]!
}
type Warranty { provider: String! level: String startsAt: DateTime endsAt: DateTime! source: String! verifiedAt: DateTime }
type Support { provider: String! contractNumber: String level: String endsAt: DateTime! source: String! verifiedAt: DateTime }
type EndOfLife { endOfSale: DateTime endOfSoftwareMaintenance: DateTime endOfSupport: DateTime source: String! verifiedAt: DateTime }
type AssetAudit { id: UUID! actor: String! at: DateTime! field: String! fromValue: String toValue: String note: String }
"""Register totals per layer: rows, rows with a data gap, and rows whose cover has already ended."""
type AssetSummary { layer: CiLayer! count: Int! needsData: Int! warrantyExpired: Int! supportExpired: Int! endOfSupportPassed: Int! }
type SupportContract { id: UUID! vendor: Ci! contractNumber: String! level: String! endsAt: DateTime! primaryContact: VendorContact }
type VendorContact { id: UUID! name: String! role: String! email: String phone: String portalUrl: String }
type InfraPlan { id: UUID! number: String! name: String! kind: String! status: PlanStatus! bom: [BomLine!]! estimatedCost: Money targetSite: Ci targetRacks: [Ci!]! plannedLiveAt: DateTime assets: [AssetRecord!]! }
type BomLine { description: String! manufacturer: String model: String sku: String layer: CiLayer! quantity: Int! received: Int! unitCost: Money }

type Vulnerability { ci: Ci! cveId: String! cvss: Float! severity: String! fixedIn: String exploited: Boolean! internetFacing: Boolean! }
# REQ-UI-016 REQ-SEC-008 REQ-CMDB-035 (ADR-013) — one row per CVE with what it touches; the detail walks the blast radius.
type VulnerabilitySummary { ci: Ci! cveId: String! title: String! severity: String! cvss: Float! exploited: Boolean! cisaKev: Boolean! patchAvailable: Boolean! publishedAt: DateTime internetFacing: Boolean! affectedSoftware: Int! affectedHosts: Int! fixedIn: String }
type VulnerabilityDetail { summary: VulnerabilitySummary! software: [Ci!]! hosts: [Ci!]! services: [AffectedService!]! blastRadiusTruncated: Boolean! }
# REQ-UI-015 REQ-CMDB-030 REQ-CMDB-031 (ADR-013) — software products with their instances, hosts, licence and CVE count.
type LicenceSummary { ci: Ci! metric: String! licenceType: String! entitlement: Int! consumed: Int! overDeployed: Boolean! expiresAt: DateTime expired: Boolean! annualCost: Money contract: Ci }
type SoftwareProduct { ci: Ci! vendor: String! name: String! version: String! category: String endOfSupport: DateTime instances: Int! hosts: Int! running: Int! licence: LicenceSummary vulnerabilities: Int! }

type Integration { id: UUID! category: String! vendor: String! name: String! enabled: Boolean! direction: String! health: IntegrationHealth! lastSuccessAt: DateTime lastError: String deliveredLastHour: Int! failedLastHour: Int! }
# REQ-UI-014 (ADR-012) — the full configuration of one integration and its recent deliveries.
type IntegrationDetail { id: UUID! category: String! vendor: String! name: String! enabled: Boolean! direction: String! health: IntegrationHealth! lastSuccessAt: DateTime lastError: String deliveredLastHour: Int! failedLastHour: Int! endpoint: String! credentialRef: String! settings: JSON! fieldMappings: JSON! classMappings: JSON! subscribedEvents: [String!]! createdAt: DateTime! updatedAt: DateTime! }
type IntegrationDelivery { id: UUID! direction: String! eventId: UUID remoteId: String state: String! attempts: Int! responseCode: Int error: String createdAt: DateTime! completedAt: DateTime }
# REQ-UI-017 (ADR-012) — what the console needs to embed the tenant's Superset dashboard: a guest token carrying
# row-level security on tenant_id, the dashboard's embedded id and the Superset origin browsers reach.
type AnalyticsEmbed { supersetUrl: String! dashboardId: String! token: String! expiresInSeconds: Int! }

type DiscoveryNode { id: String! site: Ci status: String! lastHeartbeat: DateTime! activeJobs: Int! certificateExpiresAt: DateTime! }
type DiscoveryJob { id: UUID! collectorId: String! node: DiscoveryNode! status: String! targets: Int! scheduledAt: DateTime! startedAt: DateTime finishedAt: DateTime cisEmitted: Int! errors: Int! }
type Sweep { id: UUID! startedAt: DateTime! finishedAt: DateTime targetsTotal: Int! targetsDone: Int! devicesDiscovered: Int! budgetMinutes: Int! }
"""One discovery scope per subnet CI (REQ-DISC-029, ADR-015): its CIDR, site, exclusions, credential set and rate limit."""
type DiscoveryScope { ci: Ci! cidr: String! site: Ci exclusions: [String!]! credentialRef: String credentialType: String! rateLimitConcurrency: Int rateLimitRps: Float }
"""Fields omitted or null stay unchanged, except credentialRef and the rate limits where null clears the value."""
input DiscoveryScopeInput { exclusions: [String!] credentialRef: String credentialType: String rateLimitConcurrency: Int rateLimitRps: Float }

type LayerSummary { layer: CiLayer! count: Int! healthy: Int! degraded: Int! down: Int! visible: Boolean! }

type SearchHit { ci: Ci! score: Float! highlight: String }

type AssistantAnswer { text: String! cypher: String! rows: JSON! cis: [Ci!]! }

# REQ-SEC-005 (ADR-010) — immutable audit log: one entry per successful mutation, newest first.
type AuditEntry { id: UUID! at: DateTime! actor: String! action: String! subjectType: String! subjectId: String! details: JSON! traceparent: String }
type AuditEdge { cursor: String! node: AuditEntry! }
type AuditConnection { edges: [AuditEdge!]! pageInfo: PageInfo! totalCount: Int! }

# REQ-UI-019 REQ-CORE-012 (ADR-011) — tenant settings: the per-tenant layer above process configuration. Every
# signed-in role reads them; administrators change them. Omitted input fields keep their value.
type TenantSettings { locale: String! timeZone: String! discoveryIntervalMinutes: Int! historyRetentionDays: Int! staleAfterDays: Int! auditRetentionDays: Int! assistantEnabled: Boolean! outboundIntegrationsEnabled: Boolean! }
input TenantSettingsInput { locale: String timeZone: String discoveryIntervalMinutes: Int historyRetentionDays: Int staleAfterDays: Int auditRetentionDays: Int assistantEnabled: Boolean outboundIntegrationsEnabled: Boolean }

# REQ-UI-020 REQ-UI-024 (ADR-017) — initial setup: the organization and its business units (tenants), sites, inter-site
# links, Discovery Node registrations with one-time enrolment tokens, credential sets (OpenBao references; values are
# written to the vault and never read back), discovery scopes and the generated twin. Every signed-in role reads the
# state; administrators change it. Saving a site creates its CI; generating the twin creates link CIs and starts the
# first sweep.
enum OnboardingStep { organization sites connectivity nodes_credentials integrations generate }
enum SiteKind { datacenter colocation office branch cloud_region edge }
type BusinessUnit { tenantId: UUID! name: String! slug: String! }
type Organization { id: UUID! name: String! industry: String! timeZone: String! defaultLocale: String! regulatoryScope: [String!]! airGapped: Boolean! businessUnits: [BusinessUnit!]! createdAt: DateTime! }
input BusinessUnitInput { tenantId: UUID name: String! }
input OrganizationInput { name: String! industry: String! timeZone: String! defaultLocale: String! regulatoryScope: [String!]! airGapped: Boolean! businessUnits: [BusinessUnitInput!]! }
type GeoPoint { lat: Float! lon: Float! }
type CloudRegion { provider: String! region: String! }
type Facility { powerCapacityKw: Float! rackCount: Int! designPue: Float }
type Site { id: UUID! code: String! name: String! kind: SiteKind! tier: Int address: String! city: String! countryCode: String! geo: GeoPoint cloud: CloudRegion locationCount: Int! facility: Facility ci: Ci nodes: [DiscoveryNode!]! }
input GeoPointInput { lat: Float! lon: Float! }
input CloudRegionInput { provider: String! region: String! }
input FacilityInput { powerCapacityKw: Float! rackCount: Int! designPue: Float }
input SiteInput { code: String! name: String! kind: SiteKind! tier: Int address: String! city: String! countryCode: String! geo: GeoPointInput cloud: CloudRegionInput locationCount: Int! facility: FacilityInput }
type SiteLink { id: UUID! fromSite: Site! toSite: Site! kind: String! provider: String circuitId: String bandwidthMbps: Int! diversePaths: Int! role: String! latencyMs: Float ci: Ci }
input SiteLinkInput { fromSiteId: UUID! toSiteId: UUID! kind: String! provider: String circuitId: String bandwidthMbps: Int! diversePaths: Int! role: String! latencyMs: Float }
"""Returned once by registerNode: the clear enrolment token is never stored, only its digest."""
type NodeRegistration { node: DiscoveryNode! siteCode: String! enrolToken: String! schedulerUrl: String! }
"""A credential set as the vault holds it: the reference, the contract credential type and the field names, never a value."""
type CredentialSet { ref: String! type: String! fields: [String!]! }
input CredentialSetInput { ref: String! type: String! fields: JSON! }
input ScopeInput { cidr: String! vrf: String siteId: UUID! credentialRef: String credentialType: String }
type OnboardingState { organization: Organization! step: OnboardingStep! completedSteps: [OnboardingStep!]! sites: [Site!]! links: [SiteLink!]! nodes: [DiscoveryNode!]! credentials: [CredentialSet!]! scopes: [DiscoveryScope!]! integrations: [Integration!]! generatedAt: DateTime firstSweep: Sweep schedulerUrl: String! }

# REQ-UI-030 (ADR-020) — dashboards: per-tenant, owned by a user, optionally shared; a persona template seeds the widget
# list and the owner customises it. EstateStats is the aggregate the widgets read in one round trip; the trend series
# come from ClickHouse over the last DASHBOARD.trendDays days.
enum DashboardPersona { admin cto_cio ciso finance custom }
type DashboardWidget { id: String! kind: String! size: String! options: JSON! }
type Dashboard { id: UUID! name: String! persona: DashboardPersona! owner: String! shared: Boolean! isDefault: Boolean! mine: Boolean! widgets: [DashboardWidget!]! createdAt: DateTime! updatedAt: DateTime! }
input DashboardWidgetInput { kind: String! size: String! options: JSON }
input DashboardInput { name: String! persona: DashboardPersona! shared: Boolean = false widgets: [DashboardWidgetInput!]! }
type StageCount { stage: AssetStage! count: Int! purchaseCost: [Money!]! }
type LicenceStats { products: Int! licensed: Int! overDeployed: Int! expiringSoon: Int! expired: Int! annualCost: [Money!]! }
type VulnerabilityStats { total: Int! critical: Int! exploited: Int! cisaKev: Int! internetFacing: Int! patchAvailable: Int! affectedHosts: Int! }
type PlanStatusCost { status: PlanStatus! count: Int! estimatedCost: [Money!]! }
type PowerStats { racks: Int! ratedWatts: Int! currentWatts: Int! }
type IpamStats { subnets: Int! averageUtilisationPercent: Float! critical: Int! }
type NodeStats { total: Int! online: Int! }
type IntegrationStats { total: Int! healthy: Int! failedLastHour: Int! }
type EstateTrend { days: [DateTime!]! cis: [Int!]! discoveryRuns: [Int!]! events: [Int!]! incidents: [Int!]! }
type EstateStats {
  assetsByStage: [StageCount!]!
  licences: LicenceStats!
  vulnerabilities: VulnerabilityStats!
  endOfSupport: Int!
  plans: [PlanStatusCost!]!
  power: PowerStats!
  ipam: IpamStats!
  nodes: NodeStats!
  integrations: IntegrationStats!
  incidentsOpen: Int!
  trend: EstateTrend!
}

type Query {
  dashboards: [Dashboard!]!
  estateStats: EstateStats!
  ci(id: UUID!, asOf: DateTime): Ci
  cis(filter: CiFilter, first: Int = 50, after: String): CiConnection!
  search(text: String!, layers: [CiLayer!], first: Int = 20): [SearchHit!]!
  impact(ciId: UUID!, direction: Direction = upstream, maxDepth: Int = 0, asOf: DateTime): ImpactResult!
  path(fromCiId: UUID!, toCiId: UUID!): [Relationship!]!
  impactScenarios: [ImpactScenario!]!
  impactSimulation(id: UUID!): ImpactSimulation
  services(health: [HealthState!]): [ServiceHealth!]!
  incidents(open: Boolean = true): [Incident!]!
  subnets(parentId: UUID): [Subnet!]!
  nextFreeIp(subnetId: UUID!): String
  racks(roomId: UUID): [Rack!]!
  assets(filter: AssetFilter, stage: [AssetStage!], warrantyExpiringWithinDays: Int, first: Int = 50, after: String): [AssetRecord!]!
  assetSummary: [AssetSummary!]!
  plans(status: [PlanStatus!]): [InfraPlan!]!
  vulnerabilities(minCvss: Float, internetFacing: Boolean): [Vulnerability!]!
  vulnerabilitySummaries(minCvss: Float, exploitedOnly: Boolean, internetFacing: Boolean): [VulnerabilitySummary!]!
  vulnerability(cveId: String!): VulnerabilityDetail
  software(text: String, licensedOnly: Boolean, first: Int = 50): [SoftwareProduct!]!
  integrations(category: String): [Integration!]!
  integration(id: UUID!): IntegrationDetail!
  integrationDeliveries(integrationId: UUID!, first: Int = 50): [IntegrationDelivery!]!
  analyticsEmbed: AnalyticsEmbed!
  discoveryNodes: [DiscoveryNode!]!
  discoveryJobs(status: String, first: Int = 50): [DiscoveryJob!]!
  currentSweep: Sweep
  discoveryScopes(siteId: UUID): [DiscoveryScope!]!
  layers: [LayerSummary!]!
  unknownCis(first: Int = 50, after: String): CiConnection!
  auditLog(subjectType: String, subjectId: String, actor: String, action: String, first: Int = 50, after: String): AuditConnection!
  tenantSettings: TenantSettings!
  onboarding: OnboardingState!
}

input LabelCiInput { ciId: UUID! title: String! description: String! layer: CiLayer! type: String }
input ScenarioInput { name: String! kind: String! failedCiIds: [UUID!]! maxDepth: Int = 0 honourRedundancy: Boolean = true includeSharedServices: Boolean = true at: DateTime }
input PlanInput { name: String! description: String! kind: String! targetSiteId: UUID targetRackIds: [UUID!] bom: [BomLineInput!]! plannedLiveAt: DateTime }
input BomLineInput { description: String! manufacturer: String model: String sku: String layer: CiLayer! quantity: Int! unitCostAmount: Float unitCostCurrency: String }
input AssetFilter { layers: [CiLayer!] types: [String!] stages: [AssetStage!] sources: [AssetSource!] dataGaps: [AssetDataGap!] text: String warrantyExpiringWithinDays: Int }
"""Dates are calendar dates (YYYY-MM-DD)."""
input WarrantyInput { provider: String! level: String startsAt: String endsAt: String! }
input SupportInput { provider: String! contractNumber: String level: String endsAt: String! }
input EndOfLifeInput { endOfSale: String endOfSoftwareMaintenance: String endOfSupport: String }
"""Fields a person records on an asset; every change is audited per field. A null object clears that cover."""
input AssetDetailsInput { manufacturer: String model: String serialNumber: String partNumber: String custodian: String purchasedAt: String purchaseCostAmount: Float purchaseCostCurrency: String warranty: WarrantyInput support: SupportInput endOfLife: EndOfLifeInput note: String }
"""An asset with no network presence (an unmetered PDU, a device without out-of-band management): a CI of the chosen type is created with it."""
input ManualAssetInput { layer: CiLayer! type: String! name: String! assetTag: String locationCiId: UUID details: AssetDetailsInput! }
input IntegrationInput { category: String! vendor: String! name: String! endpoint: String! credentialRef: String! direction: String! settings: JSON fieldMappings: JSON classMappings: JSON subscribedEvents: [String!] }

type Mutation {
  createDashboard(input: DashboardInput!): Dashboard!
  updateDashboard(id: UUID!, input: DashboardInput!): Dashboard!
  deleteDashboard(id: UUID!): Boolean!
  setDefaultDashboard(id: UUID!): Dashboard!
  labelCi(input: LabelCiInput!): Ci!
  updateCiAttributes(ciId: UUID!, attributes: JSON!): Ci!
  """Rename a CI's short code; the new code must match the code pattern and be free within the tenant."""
  setCiCode(ciId: UUID!, code: String!): Ci!
  createRelationship(type: String!, fromCiId: UUID!, toCiId: UUID!, attributes: JSON): Relationship!
  retireRelationship(id: UUID!): Relationship!
  setLayerVisibility(layer: CiLayer!, visible: Boolean!): [LayerSummary!]!
  runDiscovery(collectorIds: [String!], siteId: UUID): Sweep!
  updateDiscoveryScope(ciId: UUID!, input: DiscoveryScopeInput!): DiscoveryScope!
  saveScenario(input: ScenarioInput!): ImpactScenario!
  runSimulation(scenarioId: UUID!): ImpactSimulation!
  createPlan(input: PlanInput!): InfraPlan!
  setPlanStatus(planId: UUID!, status: PlanStatus!): InfraPlan!
  setAssetStage(assetId: UUID!, stage: AssetStage!, note: String): AssetRecord!
  updateAsset(assetId: UUID!, input: AssetDetailsInput!): AssetRecord!
  createAsset(input: ManualAssetInput!): AssetRecord!
  upsertIntegration(id: UUID, input: IntegrationInput!): Integration!
  testIntegration(id: UUID!): Integration!
  reportIncident(incidentId: UUID!, integrationId: UUID!): IncidentLink!
  acknowledgeIncident(incidentId: UUID!): Incident!
  askAssistant(question: String!): AssistantAnswer!
  updateTenantSettings(input: TenantSettingsInput!): TenantSettings!
  updateOrganization(input: OrganizationInput!): Organization!
  upsertSite(id: UUID, input: SiteInput!): Site!
  """Removes a site that has no Node and no link; its CI is retired."""
  removeSite(id: UUID!): Boolean!
  upsertSiteLink(id: UUID, input: SiteLinkInput!): SiteLink!
  removeSiteLink(id: UUID!): Boolean!
  """Registers (or re-registers) a Discovery Node for a site and returns its one-time enrolment token."""
  registerNode(siteId: UUID!, nodeId: String!): NodeRegistration!
  """Writes a credential set to the vault under `ref`; the API keeps the reference only."""
  saveCredentialSet(input: CredentialSetInput!): CredentialSet!
  """Creates a subnet CI at a site as a discovery scope, through the outbox like any CI."""
  addDiscoveryScope(input: ScopeInput!): DiscoveryScope!
  setOnboardingStep(step: OnboardingStep!, completed: Boolean!): OnboardingState!
  """Creates the CIs the twin still lacks (links), records the generation and starts the first sweep."""
  generateTwin: OnboardingState!
}

type Subscription {
  events(types: [String!]): JSON!
  serviceHealthChanged: ServiceHealth!
  sweepProgress: Sweep!
}
