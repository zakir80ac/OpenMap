# REQ-CORE-006 — OpenMap GraphQL contract, version 1.22.0 (see docs/CONTRACTS.md). Checked by `pnpm contracts:check`.
# Served by apps/api (Mercurius). Breaking changes require an ADR and a tracker row.

scalar DateTime
scalar JSON
scalar UUID

enum CiLayer {
  dc
  network_security
  hardware
  storage
  virtualization
  cloud
  os
  containers
  databases
  applications
  saas
  unknown
}
enum Lifecycle {
  discovered
  managed
  planned
  retired
}
enum HealthState {
  healthy
  degraded
  down
  unknown
}
enum PredictedState {
  down
  degraded
  at_risk
  unaffected
}
enum AssetStage {
  planned
  in_stock
  deployed
  spare
  rma
  retired
  disposed
}
enum AssetSource {
  plan
  discovery
  manual
}
enum AssetDataGap {
  warranty
  subscription
  support
  end_of_life
}
enum PlanStatus {
  draft
  approved
  building
  live
  cancelled
}
enum IntegrationHealth {
  healthy
  warning
  failing
  disabled
}
enum Direction {
  upstream
  downstream
  both
}

type Provenance {
  collectorId: String!
  nodeId: String!
  runId: String!
  confidence: Float!
}
type ExternalId {
  source: String!
  id: String!
}
type UserLabel {
  title: String!
  description: String!
  layer: CiLayer!
  type: String
  labelledBy: String!
  labelledAt: DateTime!
}

type Ci {
  id: UUID!
  tenantId: UUID!
  type: String!
  layer: CiLayer!
  name: String!
  displayName: String!
  """
  Short code spoken in incidents and printed on cards (layer prefix plus slug); unique per tenant, editable by operators.
  """
  code: String!
  identity: JSON!
  attributes: JSON!
  tags: [String!]!
  """
  Values of the tenant's custom fields that apply to this CI's type, keyed by field key (REQ-CMDB-015).
  """
  customFields: JSON!
  externalIds: [ExternalId!]!
  lifecycle: Lifecycle!
  userLabel: UserLabel
  source: Provenance!
  observedAt: DateTime!
  validFrom: DateTime!
  validTo: DateTime
  health: HealthState!
  """
  The layer's headline measurement (ADR-016): the latest ClickHouse sample of the metric LAYER_HEADLINE_METRIC names for the CI's layer; value and observedAt are null until a collector has sampled it. For the unknown layer the value is the days since the CI was last observed.
  """
  headlineMetric: HeadlineMetric!
  relationships(
    direction: Direction = both
    types: [String!]
    first: Int = 50
    after: String
  ): RelationshipConnection!
  asset: AssetRecord
  vulnerabilities: [Vulnerability!]!
  history(from: DateTime, to: DateTime): [CiVersion!]!
  "REQ-CMDB-014 (ADR-037): the parts inside this CI, by kind then slot; removed parts only on request."
  components(includeRemoved: Boolean = false): [HardwareComponent!]!
  "REQ-CMDB-034: CPU, memory, disk and power over the last `hours` (default 168); null for types without utilisation."
  utilisation(hours: Int): CiUtilisation
}

type CiVersion {
  validFrom: DateTime!
  validTo: DateTime
  attributes: JSON!
  lifecycle: Lifecycle!
  source: Provenance!
}

"""
One headline measurement: key and label from the contract's LAYER_HEADLINE_METRIC, unit as printed after the value, metric as stored in ClickHouse.
"""
type HeadlineMetric {
  key: String!
  label: String!
  unit: String!
  metric: String!
  value: Float
  observedAt: DateTime
}

type Relationship {
  id: UUID!
  type: String!
  from: Ci!
  to: Ci!
  attributes: JSON!
  source: Provenance!
  validFrom: DateTime!
  validTo: DateTime
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}
type CiEdge {
  cursor: String!
  node: Ci!
}
type CiConnection {
  edges: [CiEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
type RelationshipEdge {
  cursor: String!
  node: Relationship!
}
type RelationshipConnection {
  edges: [RelationshipEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CiFilter {
  types: [String!]
  layers: [CiLayer!]
  lifecycle: [Lifecycle!]
  tags: [String!]
  siteId: UUID
  text: String
  attributeEquals: JSON
  health: [HealthState!]
  asOf: DateTime
  """
  Custom field values a CI must carry, keyed by field key (REQ-CMDB-015).
  """
  customFields: JSON
}

type ImpactNode {
  ci: Ci!
  depth: Int!
  predicted: PredictedState!
  path: [UUID!]!
}
type ImpactResult {
  root: Ci!
  nodes: [ImpactNode!]!
  services: [AffectedService!]!
  durationMs: Int!
}
type AffectedService {
  service: Ci!
  tier: Int!
  predicted: PredictedState!
  path: [UUID!]!
  usersAffected: Int
  revenueAtRiskPerHour: Money
  slaBudgetRemainingMinutes: Float
  recovery: Recovery
}
type Recovery {
  description: String!
  estimatedMinutes: Int!
}
type Money {
  amount: Float!
  currency: String!
}

type ImpactScenario {
  id: UUID!
  name: String!
  kind: String!
  "user: a saved what-if model; incident: the replay of a real incident's root cause (ADR-047)."
  origin: String!
  "The procedure to follow if this scenario happens for real (ADR-048)."
  runbook: Runbook
  failedCis: [Ci!]!
  options: JSON!
  createdBy: String!
  createdAt: DateTime!
}
type ImpactSimulation {
  id: UUID!
  scenario: ImpactScenario!
  ranAt: DateTime!
  durationMs: Int!
  failedCis: [Ci!]!
  affectedApplications: [Ci!]!
  services: [AffectedService!]!
  totals: ImpactTotals!
  recommendations: [Recommendation!]!
}
"A resolved incident compared with the simulation of its root cause (REQ-BSM-004, ADR-047)."
type ImpactValidation {
  id: UUID!
  incident: Incident!
  simulation: ImpactSimulation!
  rootCause: Ci
  predictedServices: [Ci!]!
  actualServices: [Ci!]!
  "Services the incident hit that the simulation did not predict."
  missedServices: [Ci!]!
  "Services the simulation predicted that the incident spared."
  unexpectedServices: [Ci!]!
  "Jaccard similarity of predicted and actual services, 0..1."
  accuracy: Float!
  validatedAt: DateTime!
}
"Prediction accuracy over a tenant's validated incidents."
type ImpactAccuracy {
  validated: Int!
  "Mean accuracy of the validated incidents; null before the first."
  meanAccuracy: Float
  "Validations whose prediction matched the incident exactly."
  exact: Int!
  "Resolved incidents with a root cause that are not validated yet."
  pending: Int!
  "Resolved incidents the sweep cannot compare because they name no root cause."
  withoutRootCause: Int!
  recent: [ImpactValidation!]!
}
"A relationship the graph may be missing: an incident caused by `from` hit the service `to`, and no modelled path reached it."
type RelationshipSuggestion {
  id: UUID!
  type: String!
  from: Ci!
  to: Ci!
  reason: String!
  occurrences: Int!
  lastIncident: Incident
  state: String!
  decidedBy: String
  decidedAt: DateTime
  relationship: Relationship
  createdAt: DateTime!
  updatedAt: DateTime!
}
type ImpactTotals {
  servicesDown: Int!
  servicesDegraded: Int!
  usersAffected: Int!
  revenueAtRiskPerHour: Money
}
type Recommendation {
  title: String!
  rationale: String!
  estimatedMinutes: Int
}

# REQ-BSM-006 REQ-BSM-008 (ADR-024) — SLAs, availability by period and incident response with RCA.
enum SlaWindow {
  calendar_month
  calendar_quarter
  calendar_year
  rolling_30d
}
enum AvailabilityGranularity {
  month
  quarter
  year
}
enum IncidentSeverity {
  informational
  low
  medium
  high
  critical
}
enum IncidentState {
  open
  acknowledged
  mitigated
  resolved
  closed
}
type SeverityTarget {
  severity: IncidentSeverity!
  respondMinutes: Int!
  resolveMinutes: Int!
}
type Sla {
  id: UUID!
  name: String!
  description: String!
  availabilityTargetPercent: Float!
  window: SlaWindow!
  """
  Targets for every severity: the SLA's own where it names one, the platform defaults elsewhere.
  """
  responseTargets: [SeverityTarget!]!
  burnRateAlert: Float!
  services: [Ci!]!
  createdBy: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}
"""
One calendar period (in the tenant's time zone) or SLA window of a service's availability.
"""
type AvailabilityPeriod {
  granularity: AvailabilityGranularity
  year: Int!
  month: Int
  quarter: Int
  periodStart: DateTime!
  periodEnd: DateTime!
  """
  True while the period is still running; figures run to now.
  """
  current: Boolean!
  """
  Null when the service was not observed at all in the period.
  """
  availabilityPercent: Float
  elapsedMinutes: Float!
  downtimeMinutes: Float!
  degradedMinutes: Float!
  unknownMinutes: Float!
  targetPercent: Float
  """
  Whether availability meets the target; null without a target or a figure.
  """
  met: Boolean
  budgetMinutes: Float
  budgetRemainingMinutes: Float
  burnRate: Float
  """
  Incidents of the service that were open during the period.
  """
  incidents: [Incident!]!
}
type ServiceAvailability {
  service: Ci!
  sla: Sla
  periods: [AvailabilityPeriod!]!
}
type ServiceHealth {
  service: Ci!
  state: HealthState!
  since: DateTime!
  rootCauses: [Ci!]!
  slaTarget: Float!
  errorBudgetRemainingMinutes: Float!
  sla: Sla
  """
  The SLA's current window (or the rolling 30 days without an SLA).
  """
  currentWindow: AvailabilityPeriod!
  availability(granularity: AvailabilityGranularity!, periods: Int): [AvailabilityPeriod!]!
}
type CorrectiveAction {
  description: String!
  owner: String
  dueAt: DateTime
  done: Boolean!
}
type Rca {
  summary: String!
  rootCauseCi: Ci
  contributingFactors: [String!]!
  correctiveActions: [CorrectiveAction!]!
  owner: String
  dueAt: DateTime
  completedAt: DateTime
  updatedBy: String!
  updatedAt: DateTime!
}
"""
One step of an incident's history: engine events and people's actions, oldest first.
"""
type IncidentEvent {
  at: DateTime!
  actor: String!
  kind: String!
  details: JSON!
}
"""
REQ-CMDB-041 — one page of the register with its totals, for page controls (page numbers start at 1).
"""
type AssetPage {
  items: [AssetRecord!]!
  totalCount: Int!
  page: Int!
  pageSize: Int!
  pageCount: Int!
}
type Incident {
  id: UUID!
  title: String!
  description: String!
  severity: IncidentSeverity!
  state: IncidentState!
  source: String!
  service: Ci!
  sla: Sla
  openedAt: DateTime!
  acknowledgedAt: DateTime
  resolvedAt: DateTime
  closedAt: DateTime
  assignee: String
  respondBy: DateTime
  resolveBy: DateTime
  responseBreachedAt: DateTime
  resolutionBreachedAt: DateTime
  resolutionNote: String
  rootCause: Ci
  alerts: Int!
  links: [IncidentLink!]!
  rca: Rca
  timeline: [IncidentEvent!]!
  "The runbook an operator attached (REQ-BSM-005, ADR-048)."
  runbook: Runbook
  "When none is attached: the runbook of the saved scenario of the incident's root cause, if any."
  suggestedRunbook: Runbook
  "Every step run on this incident, oldest first."
  runbookRuns: [RunbookStepRun!]!
  "The attached runbook's estimate, the sum of its step minutes."
  recoveryEstimateMinutes: Int
  "Minutes of the steps whose latest run is neither done nor triggered."
  recoveryRemainingMinutes: Int
}
"Sites, inter-site links with their latest probes, and the HA / DR readiness findings (REQ-BSM-007, ADR-025)."
type Connectivity {
  sites: [ConnectivitySite!]!
  links: [ConnectivityLink!]!
  "Open findings, then those cleared in the last READINESS window, newest first."
  findings: [ReadinessFinding!]!
  "How often links are probed; 0 when probing is off."
  probeIntervalSeconds: Int!
}
type ConnectivitySite {
  ci: Ci!
  code: String!
  "primary, dr or none."
  drRole: String!
  criticality: Int
  "Healthy paths: healthy links touching the site, counting each link's diverse paths."
  healthyPaths: Int!
  "Site kind (datacenter, colocation, office, branch_bundle, cloud_region …); REQ-UI-026."
  kind: String
  "Uptime Institute tier, 1 to 4; null when the site has none."
  tier: Int
  powerCapacityKw: Float
  designPue: Float
  "Latest measured PUE and when it was taken; null when the site reports none."
  pue: Float
  pueAt: DateTime
  "Racks in the site's facility tree (building, room, row, rack)."
  racks: Int!
  "Open readiness findings on the site or its links, plus unresolved incidents whose root cause is located in the site."
  openAlerts: Int!
}
"Redundancy between a link's two sites, over every link joining them (REQ-UI-026)."
enum LinkRedundancy {
  active_active
  active_standby
  degraded
  down
  single_path
}
type ConnectivityLink {
  ci: Ci!
  fromSite: String
  toSite: String
  kind: String
  provider: String
  role: String
  replication: Boolean!
  diversePaths: Int!
  probeTarget: String
  "From the latest probe; null when the link has not been probed."
  reachable: Boolean
  latencyMs: Float
  lossPercent: Float
  probedAt: DateTime
  slaLatencyMs: Int
  "Committed bandwidth; null when the link records none (REQ-UI-026)."
  capacityMbps: Int
  "Latest measured traffic; null when the link reports none."
  throughputMbps: Float
  "Traffic as a share of the committed bandwidth; null without both."
  utilisationPercent: Float
  redundancy: LinkRedundancy!
}
type ReadinessFinding {
  id: UUID!
  "diverse_paths, dr_reachable or replication_healthy."
  rule: String!
  subject: Ci
  detail: String!
  "open or cleared."
  state: String!
  openedAt: DateTime!
  clearedAt: DateTime
  incident: Incident
}
"A procedure in the tenant's catalogue, attached to scenarios and incidents (REQ-BSM-005, ADR-048)."
type Runbook {
  id: UUID!
  code: String!
  title: String!
  ownerTeam: String!
  "ISO calendar date (YYYY-MM-DD)."
  lastReviewedAt: String
  steps: [RunbookStep!]!
  "Sum of the steps' estimated minutes; null when no step has one."
  estimatedMinutes: Int
  updatedAt: DateTime!
}
type RunbookStep {
  order: Int!
  instruction: String!
  automation: RunbookAutomation
  estimatedMinutes: Int
}
"A SOAR playbook or automation job the step triggers through an integration."
type RunbookAutomation {
  integration: Integration
  action: String!
}
type RunbookStepRun {
  id: UUID!
  order: Int!
  "done (a manual step), triggered (automation delivered) or failed."
  outcome: String!
  actor: String!
  note: String
  integration: Integration
  remoteId: String
  error: String
  at: DateTime!
}
input RunbookInput {
  code: String!
  title: String!
  ownerTeam: String!
  "ISO calendar date (YYYY-MM-DD)."
  lastReviewedAt: String
  steps: [RunbookStepInput!]!
}
input RunbookStepInput {
  order: Int!
  instruction: String!
  estimatedMinutes: Int
  automation: RunbookAutomationInput
}
input RunbookAutomationInput {
  integrationId: UUID!
  action: String!
}
type IncidentLink {
  integration: Integration!
  remoteId: String!
  remoteUrl: String
  remoteState: String!
  syncedAt: DateTime!
}

type Subnet {
  ci: Ci!
  cidr: String!
  vrf: String
  utilisationPercent: Float!
  addresses(first: Int = 100, after: String): CiConnection!
  children: [Subnet!]!
}
type Rack {
  ci: Ci!
  units: Int!
  occupiedUnits: Int!
  devices: [RackDevice!]!
  powerFeeds: [PowerFeed!]!
  row: Ci
  room: Ci
}
type RackDevice {
  ci: Ci!
  startUnit: Int!
  heightUnits: Int!
  face: String!
}
type PowerFeed {
  ci: Ci!
  ratedWatts: Int!
  currentWatts: Int!
}

# REQ-CMDB-039 REQ-CMDB-040 (ADR-023) — the register: one row per owned CI (discovery), per BOM unit (plan) or per
# manual entry; warranty, support and end-of-life carried on the row, the missing ones listed as dataGaps.
type AssetRecord {
  id: UUID!
  ci: Ci
  """
  The CI's type at creation; null for a planned asset with no CI yet.
  """
  ciType: String
  layer: CiLayer!
  source: AssetSource!
  assetTag: String!
  serialNumber: String
  manufacturer: String
  model: String
  partNumber: String
  stage: AssetStage!
  stageChangedAt: DateTime!
  custodian: String
  ownerCostCentre: Ci
  locationCi: Ci
  purchasedAt: DateTime
  purchaseCost: Money
  depreciation: Depreciation!
  """
  Value today under the depreciation schedule; null without a purchase cost and date (REQ-CMDB-017).
  """
  bookValue: Money
  stock: Stock
  warranty: Warranty
  warrantyEndsAt: DateTime
  """
  The subscription of a software, SaaS or cloud asset (ADR-027); null on hardware.
  """
  subscription: SubscriptionCover
  subscriptionEndsAt: DateTime
  """
  Credits left on the subscription, when the vendor reports a balance.
  """
  creditsRemaining: Float
  support: Support
  supportContract: SupportContract
  """
  The support end date from the row's own support entry or its support contract, whichever is set.
  """
  supportEndsAt: DateTime
  endOfLife: EndOfLife
  endOfSupport: DateTime
  dataGaps: [AssetDataGap!]!
  plan: InfraPlan
  audits: [AssetAudit!]!
}
type Warranty {
  provider: String!
  level: String
  startsAt: DateTime
  endsAt: DateTime!
  source: String!
  verifiedAt: DateTime
}
"""
REQ-CMDB-042 (ADR-027) — prepaid credits of a cloud or SaaS subscription as the vendor's billing API reported them.
"""
type Credits {
  remaining: Float!
  unit: String!
  currency: String
  asOf: DateTime!
}
"""
Subscription cover of software, SaaS and cloud assets: the term and the credits left; endsAt or credits is set.
"""
type SubscriptionCover {
  provider: String!
  plan: String
  startsAt: DateTime
  endsAt: DateTime
  credits: Credits
  source: String!
  verifiedAt: DateTime
}
type Support {
  provider: String!
  contractNumber: String
  level: String
  endsAt: DateTime!
  source: String!
  verifiedAt: DateTime
}
type EndOfLife {
  endOfSale: DateTime
  endOfSoftwareMaintenance: DateTime
  endOfSupport: DateTime
  source: String!
  verifiedAt: DateTime
}
type AssetAudit {
  id: UUID!
  actor: String!
  at: DateTime!
  field: String!
  fromValue: String
  toValue: String
  note: String
}
"""
Register totals per layer: rows, rows with a data gap, and rows whose cover has already ended.
"""
# REQ-CMDB-017 — the depreciation schedule of an asset; the book value follows from it and the purchase.
type Depreciation {
  method: String!
  usefulLifeMonths: Int!
  residualValue: Money!
}
# REQ-CMDB-019 — spare-part stock control on a stocked asset.
type Stock {
  onHand: Int!
  reorderPoint: Int!
  belowReorderPoint: Boolean!
}
type AssetSummary {
  layer: CiLayer!
  count: Int!
  needsData: Int!
  """
  Stocked spares at or below their reorder point (REQ-CMDB-019).
  """
  belowReorderPoint: Int!
  warrantyExpired: Int!
  subscriptionExpired: Int!
  supportExpired: Int!
  endOfSupportPassed: Int!
}
type SupportContract {
  id: UUID!
  vendor: Ci!
  contractNumber: String!
  level: String!
  endsAt: DateTime!
  primaryContact: VendorContact
}
type VendorContact {
  id: UUID!
  name: String!
  role: String!
  email: String
  phone: String
  portalUrl: String
  availability: String
  escalationLevel: Int!
}
# REQ-CMDB-026 REQ-CMDB-027 REQ-CMDB-028 REQ-CMDB-029 (ADR-035) — the commercial register over vendor, contract and
