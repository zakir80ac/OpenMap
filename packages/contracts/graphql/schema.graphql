# REQ-AI-007 (ADR-028) — a conversational answer: the intent the question was classified into, the figures the prose
# rests on, every retrieval step as evidence (store, query, parameters, rows, duration), suggested follow-ups and, when
# a name or the intent is ambiguous, the clarifying question with its choices instead of a guess. `cypher` and `rows`
# carry the graph query of a `graph.query` step (empty otherwise); `grounded` is false when the model's prose failed
# the grounding guard and the deterministic summary was used instead.
enum AssistantIntent {
  lookup
  count
  attribute_stats
  measurement
  availability
  incidents
  impact
  history
  howto
  report
  anomalies
  unknown
}
enum AssistantStore {
  postgres
  memgraph
  clickhouse
  catalogue
}
