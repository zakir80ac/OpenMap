type FirewallPolicy { device: Ci! summary: FirewallSummary! chains: [FirewallChain!]! rules: [FirewallRule!]! objects: [FirewallObject!]! truncated: Boolean! }
type FirewallDevice { device: Ci! rules: Int! objects: Int! }
