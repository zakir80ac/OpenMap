# REQ-CMDB-034: resource utilisation from collector samples.
enum UtilisationMeasure {
  cpu
  memory
  disk
  power
}
"hot: CPU, memory or disk at or above the hot share; idle: CPU and memory at or below the idle share."
enum UtilisationState {
  hot
  idle
  normal
  unknown
}
enum UtilisationSort {
  cpu
  memory
  disk
  power
  name
}
type UtilisationPoint {
  at: DateTime!
  "Average over the bucket."
  value: Float!
  "Highest sample in the bucket."
  peak: Float!
}
type UtilisationSeries {
  measure: UtilisationMeasure!
  metric: String!
  "percent or W."
  unit: String!
  latest: Float
  latestAt: DateTime
  average: Float
  peak: Float
  points: [UtilisationPoint!]!
}
type CiUtilisation {
  state: UtilisationState!
  hours: Int!
  series: [UtilisationSeries!]!
}
type UtilisationRow {
  ci: Ci!
  state: UtilisationState!
  cpu: Float
  memory: Float
