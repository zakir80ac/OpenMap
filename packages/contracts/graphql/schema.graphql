  action: String!
}
type RunbookStepRun {
  id: UUID!
  order: Int!
  "done (a manual step), triggered (automation delivered) or failed."
  outcome: String!
  actor: String!
  note: String
  integration: Integration
  remoteId: String
  error: String
  at: DateTime!
}
input RunbookInput {
  code: String!
  title: String!
  ownerTeam: String!
  "ISO calendar date (YYYY-MM-DD)."
  lastReviewedAt: String
  steps: [RunbookStepInput!]!
}
input RunbookStepInput {
  order: Int!
  instruction: String!
  estimatedMinutes: Int
  automation: RunbookAutomationInput
}
input RunbookAutomationInput {
  integrationId: UUID!
  action: String!
}
type IncidentLink {
  integration: Integration!
  remoteId: String!
  remoteUrl: String
  remoteState: String!
  syncedAt: DateTime!
}

# REQ-IPAM-004 (ADR-063) — switch port management: a device's ports with their state, speed, VLAN, the neighbour on
# the far end (LLDP, CDP, a server NIC), the MAC addresses each port has learned resolved to IPs and the CIs that own
# them, how long a down port has not been up (unused past SWITCH_PORTS.unusedDays), each port's history of changes, and
# where a MAC address has been seen.
enum PortState { up down admin_down unknown }
type LearnedMac { mac: String! ip: String owner: Ci }
type PortNeighbour { ci: Ci! port: String protocol: String }
type SwitchPort { port: Ci! name: String! alias: String state: PortState! speedMbps: Int mtu: Int vlan: Int learnedMacs: [LearnedMac!]! learnedMacCount: Int! neighbour: PortNeighbour lastChange: DateTime daysNotUp: Int unused: Boolean! }
type SwitchPortSummary { ports: Int! up: Int! down: Int! adminDown: Int! unknown: Int! unused: Int! learnedMacs: Int! }
type SwitchPorts { device: Ci! summary: SwitchPortSummary! ports: [SwitchPort!]! }
type PortChange { at: DateTime! key: String! from: String to: String }
type PortHistory { port: Ci! days: Int! versions: Int! changes: [PortChange!]! }
enum MacSightingKind { learned_on_port arp owner }
type MacSighting { kind: MacSightingKind! ci: Ci! port: String ip: String seenAt: DateTime! }
type MacLookup { mac: String! sightings: [MacSighting!]! }

# REQ-PERF-005 (ADR-071): the platform's own health: its Prometheus scrape targets with their request rate, latency,
# errors and resources, the stores the reconciler probes, the outbox and queue backlogs, the SLO indicators against
# their objectives (the same catalogue the alert rules use), the firing alerts, and the perf budget results.
enum PlatformTargetHealth { up down unknown }
enum PlatformSliId { targets_down stores_down openbao_sealed graphql_p95_seconds graphql_error_ratio http_error_ratio event_loop_lag_p99_seconds outbox_oldest_pending_seconds queue_waiting_jobs backup_age_seconds }
enum PlatformSliUnit { count seconds ratio }
enum PlatformSliStatus { ok breach no_data }
enum PlatformAlertState { firing pending }
enum PerfMeasure { p95Ms fps minutes performance accessibility bestPractices }
enum PerfComparison { max min }
type PrometheusStatus { reachable: Boolean! version: String error: String }
type PlatformTarget {
  "The compose service behind the scrape target (its host), e.g. api or clickhouse."
  service: String!
  job: String!
  instance: String!
  health: PlatformTargetHealth!
  lastScrapeAt: DateTime
  scrapeDurationMs: Float
  lastError: String
  "HTTP requests per second over the window (OpenTelemetry server metrics)."
  requestRate: Float
  p95Ms: Float
  "Share of HTTP requests answered with a 5xx status."
  errorRatio: Float
  eventLoopP99Ms: Float
  residentBytes: Float
  "CPU cores in use, averaged over the window."
  cpuCores: Float
}
type PlatformStoreHealth { store: String! "Null when nothing reported the store in the last scrape." up: Boolean probeMs: Float }
type PlatformOutbox { pending: Int oldestAgeSeconds: Float deliveredPerSecond: Float failuresPerSecond: Float }
type PlatformQueue { queue: String! waiting: Int! active: Int! delayed: Int! failed: Int! }
type PlatformSli { id: PlatformSliId! unit: PlatformSliUnit! "Null when there was nothing to measure in the window." value: Float objective: Float! status: PlatformSliStatus! }
type PlatformAlert {
  name: String!
  sli: PlatformSliId
  severity: String!
  state: PlatformAlertState!
  "What the alert is about: the instance, store, queue or service its labels name."
  subject: String
  activeAt: DateTime
  value: Float
}
type PerfBudgetCheck { result: String! measure: PerfMeasure! page: String value: Float! budget: Float! comparison: PerfComparison! withinBudget: Boolean! measuredAt: DateTime }
type PerfBudgets {
  "False when this deployment keeps no perf results directory (PERF_RESULTS_DIR unset)."
  configured: Boolean!
  checks: [PerfBudgetCheck!]!
  "Result files that could not be read, each with the reason."
  invalid: [String!]!
}
type PlatformHealth {
  observedAt: DateTime!
  windowMinutes: Int!
  prometheus: PrometheusStatus!
  targets: [PlatformTarget!]!
  stores: [PlatformStoreHealth!]!
  outbox: PlatformOutbox!
  queues: [PlatformQueue!]!
  slis: [PlatformSli!]!
  alerts: [PlatformAlert!]!
  budgets: PerfBudgets!
}

# REQ-INT-019 (ADR-066): backup sets of the stores of record, from their manifests.
enum BackupState { running complete failed }
type BackupSet { name: String! status: BackupState! createdAt: DateTime! completedAt: DateTime postgresBytes: Float clickhouseBytes: Float migration: String cis: Int "REQ-SEC-011 (ADR-067): files encrypted under a Transit-wrapped data key." encrypted: Boolean! error: String }
type Backups {
  "False when this deployment keeps no backup directory (BACKUP_DIR unset)."
  configured: Boolean!
