  query: String!
  params: JSON!
  rows: Int!
  durationMs: Int!
  error: String
}
type AssistantOption {
  label: String!
  value: String!
}
type AssistantClarification {
  question: String!
  options: [AssistantOption!]!
}
type AssistantAnswer {
  text: String!
  cypher: String!
  rows: JSON!
  cis: [Ci!]!
  intent: AssistantIntent!
  confidence: Float!
  figures: [AssistantFigure!]!
  evidence: [AssistantEvidence!]!
  followUps: [String!]!
  clarification: AssistantClarification
  grounded: Boolean!
  """
  REQ-AI-008: the conversation this answer was appended to (created when the question opened one) and its turn.
  """
  conversationId: UUID!
  turnId: UUID!
}

# REQ-DEP-001 (ADR-030) — network topology maps. L2: devices joined by the LLDP/CDP neighbour links between their
# interfaces, hosts attached by their cabling. L3: devices joined to the subnets their addresses sit in. A link
# aggregates every interface pair between the same two nodes.
enum TopologyLayer {
  l2
  l3
}
type TopologyNode {
  ci: Ci!
  """
  Links this node has in the map.
  """
  degree: Int!
}
type TopologyLink {
  id: String!
  from: Ci!
  to: Ci!
  """
  neighbour (device to device), host (cabling to a device port) or subnet (device address in a subnet).
  """
  kind: String!
  """
  Interface pairs (L2) or addresses (L3) the link aggregates.
  """
  count: Int!
  ports: [String!]!
  protocols: [String!]!
  media: [String!]!
  speedMbps: Float
}
type NetworkTopology {
  layer: TopologyLayer!
  nodes: [TopologyNode!]!
  links: [TopologyLink!]!
  """
  True when the map hit the node cap and was cut.
  """
  truncated: Boolean!
  durationMs: Int!
}

# REQ-CMDB-015 — tenant-defined custom fields on CIs; values live in Ci.customFields keyed by the field key.
