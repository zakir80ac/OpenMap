  sensitive field cannot be used in a CI filter. Text fields only.
  """
  sensitive: Boolean!
  """
  Current CIs carrying a value for the field.
  """
  usage: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}
input CustomFieldDefinitionInput {
  key: String!
  labelEn: String!
  labelAr: String!
  description: String
  type: CustomFieldType!
  options: [String!]
  appliesTo: [String!]
  required: Boolean
  sensitive: Boolean
}

# REQ-CMDB-033 REQ-CMDB-036 (ADR-032) — importing a spreadsheet or another CMDB's export. The file travels as base64;
# a preview reads it with a mapping (proposed from the headers when none is given) and says what would be queued and
# what refused; a run queues the observations for the reconciler as the `import` source, which fills what discovery
# has not observed and never overwrites it.
