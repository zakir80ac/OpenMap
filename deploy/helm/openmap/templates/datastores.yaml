# REQ-INT-003 — stateful datastores as in-chart StatefulSets (no external subcharts, air-gap friendly).
# REQ-INT-001 — the schemas Keycloak and Superset use inside the shared Postgres, created on first start exactly as
# deploy/compose/postgres/init does; OpenMap's own tables live in public and are managed by the migrations job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmap.fullname" . }}-postgres-init
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
data:
  01-schemas.sql: |
    -- REQ-INT-001 — schemas for the platform services that share the Postgres instance.
    -- OpenMap's own tables live in public (Prisma); Keycloak and Superset get their own schemas.
    CREATE SCHEMA IF NOT EXISTS keycloak;
    CREATE SCHEMA IF NOT EXISTS superset;
  {{- if .Values.postgres.tde.enabled }}
  # REQ-SEC-011 (ADR-067): pg_tde on first start, the same script as compose.
  00-pg-tde.sh: |
{{ .Files.Get "files/postgres/00-pg-tde.sh" | indent 4 }}
  agent-pgtde.hcl: |
{{ .Files.Get "files/openbao/agent-pgtde.hcl" | indent 4 }}
  {{- end }}
  # ADR-068: network connections only over TLS.
  pg_hba.conf: |
{{ .Files.Get "files/postgres/pg_hba.conf" | indent 4 }}
{{- if .Values.clickhouse.encryption.enabled }}
---
# REQ-SEC-011 (ADR-067 step 6): the encrypted disk, the entrypoint wrapper that waits for its key, and the agent's config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmap.fullname" . }}-clickhouse-encryption
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
data:
  encrypted-disk.xml: |
{{ .Files.Get "files/clickhouse/encrypted-disk.xml" | indent 4 }}
  with-disk-key.sh: |
{{ .Files.Get "files/clickhouse/with-disk-key.sh" | indent 4 }}
  agent-clickhouse.hcl: |
{{ .Files.Get "files/openbao/agent-clickhouse.hcl" | indent 4 }}
  tls.xml: |
{{ .Files.Get "files/clickhouse/tls.xml" | indent 4 }}
{{- end }}
{{- if .Values.storeTls.enabled }}
---
# REQ-SEC-011 (ADR-068): the store agents' configuration and the wrappers that take a renewed certificate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmap.fullname" . }}-store-tls
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "store-tls") | nindent 4 }}
data:
  agent-store-tls.hcl: |
{{ .Files.Get "files/openbao/agent-store-tls.hcl" | indent 4 }}
  with-tls.sh: |
{{ .Files.Get "files/valkey/with-tls.sh" | indent 4 }}
  restart-on-renewal.sh: |
{{ .Files.Get "files/tls/restart-on-renewal.sh" | indent 4 }}
{{- end }}
---
{{- $root := . }}
{{- range $store := list
  (dict "component" "postgres" "image" .Values.postgres.image "port" 5432 "storage" .Values.postgres.storage "mount" "/data/db" "resources" .Values.postgres.resources)
  (dict "component" "memgraph" "image" .Values.memgraph.image "port" 7687 "storage" .Values.memgraph.storage "mount" "/var/lib/memgraph" "resources" .Values.memgraph.resources)
  (dict "component" "clickhouse" "image" .Values.clickhouse.image "port" 8443 "storage" .Values.clickhouse.storage "mount" "/var/lib/clickhouse" "resources" .Values.clickhouse.resources)
  (dict "component" "valkey" "image" .Values.valkey.image "port" 6379 "storage" .Values.valkey.storage "mount" "/data" "resources" .Values.valkey.resources)
  (dict "component" "meilisearch" "image" .Values.meilisearch.image "port" 7700 "storage" .Values.meilisearch.storage "mount" "/meili_data" "resources" .Values.meilisearch.resources) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmap.svc" (dict "root" $root "component" $store.component) }}
  labels: {{- include "openmap.componentLabels" (dict "root" $root "component" $store.component) | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "openmap.selector" (dict "root" $root "component" $store.component) | nindent 4 }}
  ports:
    - name: {{ $store.component }}
      port: {{ $store.port }}
      targetPort: {{ $store.port }}
{{- if eq $store.component "clickhouse" }}
    - name: native
      port: 9440
      targetPort: 9440
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openmap.svc" (dict "root" $root "component" $store.component) }}
  labels: {{- include "openmap.componentLabels" (dict "root" $root "component" $store.component) | nindent 4 }}
spec:
  serviceName: {{ include "openmap.svc" (dict "root" $root "component" $store.component) }}
  replicas: 1
  selector:
    matchLabels: {{- include "openmap.selector" (dict "root" $root "component" $store.component) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openmap.selector" (dict "root" $root "component" $store.component) | nindent 8 }}
    spec:
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $store.component "postgres" }}
      # The Percona image runs PostgreSQL as uid 26; the agent sidecar writes the token as that user.
      securityContext: { fsGroup: 26 }
      {{- if $root.Values.postgres.tde.enabled }}
      # ADR-068: the agent tells the postmaster to reload a renewed certificate.
      shareProcessNamespace: true
      {{- end }}
      {{- end }}
      {{- if and (eq $store.component "clickhouse") $root.Values.clickhouse.encryption.enabled }}
      # The agent sidecar writes the disk key as the ClickHouse image's user (uid 101).
      securityContext: { fsGroup: 101 }
      {{- end }}
      {{- if and $root.Values.storeTls.enabled (eq $store.component "valkey") }}
      # ADR-068: the agent sidecar writes the certificate as the Valkey image's user (uid 999).
      securityContext: { fsGroup: 999, fsGroupChangePolicy: OnRootMismatch }
      {{- end }}
      {{- if and $root.Values.storeTls.enabled (eq $store.component "memgraph") }}
      securityContext: { fsGroup: 103, fsGroupChangePolicy: OnRootMismatch }
      {{- end }}
      {{- if and $root.Values.storeTls.enabled (eq $store.component "meilisearch") }}
      # The agent sidecar (OpenBao's user, gid 1000) reads its AppRole files through the pod's group.
      securityContext: { fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch }
      {{- end }}
      {{- if eq $store.component "memgraph" }}
      # Memgraph crashes on start when its data directory is not owned by its own user (a fresh PersistentVolume is
      # root-owned), so the volume is handed over before the database starts; the same image, as root, does it.
      initContainers:
        - name: own-data
          image: {{ if $root.Values.image.registry }}{{ $root.Values.image.registry }}/{{ end }}{{ $store.image }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["sh", "-c", "chown -R memgraph:memgraph {{ $store.mount }}"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - name: data
              mountPath: {{ $store.mount }}
        {{- if $root.Values.storeTls.enabled }}
        {{- include "openmap.serviceCaInit" $root | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $store.component }}
          image: {{ if $root.Values.image.registry }}{{ $root.Values.image.registry }}/{{ end }}{{ $store.image }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $store.port }}
          resources: {{- toYaml $store.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ $store.mount }}
            {{- if eq $store.component "postgres" }}
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            {{- if $root.Values.postgres.tde.enabled }}
            - { name: pgtde-token, mountPath: /run/pgtde, readOnly: true }
            {{- include "openmap.caMount" $root | nindent 12 }}
            {{- end }}
            - { name: hba, mountPath: /etc/openmap/pg_hba.conf, subPath: pg_hba.conf, readOnly: true }
            {{- end }}
            {{- if and (eq $store.component "clickhouse") $root.Values.clickhouse.encryption.enabled }}
            - { name: clickhouse-encryption, mountPath: /etc/clickhouse-server/config.d/encrypted-disk.xml, subPath: encrypted-disk.xml, readOnly: true }
            - { name: clickhouse-encryption, mountPath: /usr/local/bin/with-disk-key.sh, subPath: with-disk-key.sh, readOnly: true }
            - { name: clickhouse-key, mountPath: /run/clickhouse-key, readOnly: true }
            - { name: clickhouse-encryption, mountPath: /etc/clickhouse-server/config.d/tls.xml, subPath: tls.xml, readOnly: true }
            {{- include "openmap.caMount" $root | nindent 12 }}
            {{- end }}
            {{- if and $root.Values.storeTls.enabled (has $store.component (list "memgraph" "valkey" "meilisearch")) }}
            - { name: store-tls, mountPath: /run/store-tls, readOnly: true }
            - { name: store-tls-files, mountPath: {{ if eq $store.component "valkey" }}/usr/local/bin/with-tls.sh{{ else }}/usr/local/bin/restart-on-renewal.sh{{ end }}, subPath: {{ if eq $store.component "valkey" }}with-tls.sh{{ else }}restart-on-renewal.sh{{ end }}, readOnly: true }
            {{- end }}
            {{- if and $root.Values.storeTls.enabled (has $store.component (list "valkey" "meilisearch")) }}
            {{- include "openmap.caMount" $root | nindent 12 }}
            {{- end }}
            {{- if and $root.Values.storeTls.enabled (eq $store.component "valkey") }}
            - { name: valkey-live, mountPath: /run/valkey-live }
            {{- end }}
          {{- if eq $store.component "postgres" }}
          env:
            - { name: POSTGRES_INITDB_ARGS, value: {{ printf "--locale=%s" $root.Values.postgres.locale | quote }} }
            {{- if $root.Values.postgres.tde.enabled }}
            - { name: OPENBAO_ADDR, value: {{ include "openmap.vaultAddr" $root | quote }} }
            - { name: OPENBAO_CA, value: /run/openmap/ca/services-ca.crt }
            - { name: PG_TDE_TOKEN_WAIT_SECONDS, value: {{ $root.Values.postgres.tde.tokenWaitSeconds | quote }} }
            {{- end }}
          {{- if $root.Values.postgres.tde.enabled }}
          # ADR-068: TLS required (pg_hba.conf), the certificate rendered by the agent sidecar.
          args: ["postgres", "-c", "shared_preload_libraries=pg_tde", "-c", "ssl=on", "-c", "ssl_cert_file=/run/pgtde/tls.pem", "-c", "ssl_key_file=/run/pgtde/tls.pem", "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/etc/openmap/pg_hba.conf"]
          {{- end }}
          envFrom:
            - secretRef: { name: {{ include "openmap.fullname" $root }}-datastores }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ $root.Values.postgres.username | quote }}] }
            periodSeconds: 5
        {{- if $root.Values.postgres.tde.enabled }}
        # REQ-SEC-011 (ADR-067): logs in with the pg-tde AppRole and keeps the token pg_tde reads fresh.
        - name: pgtde-agent
          image: {{ if $root.Values.image.registry }}{{ $root.Values.image.registry }}/{{ end }}{{ $root.Values.openbao.image }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["agent", "-config=/openbao/config/agent-pgtde.hcl"]
          securityContext: { runAsUser: 26, runAsGroup: 26 }
          env:
            - { name: BAO_ADDR, value: {{ include "openmap.vaultAddr" $root | quote }} }
            - { name: TLS_COMMON_NAME, value: {{ include "openmap.svc" (dict "root" $root "component" "postgres") | quote }} }
            - { name: BAO_CACERT, value: /run/openmap/ca/services-ca.crt }
          resources: {{- toYaml $root.Values.postgres.tde.agentResources | nindent 12 }}
          volumeMounts:
            - { name: pgtde-token, mountPath: /run/pgtde }
            - { name: pgtde-approle, mountPath: /openbao/approle-pgtde, readOnly: true }
            - { name: pgtde-config, mountPath: /openbao/config, readOnly: true }
            {{- include "openmap.caMount" $root | nindent 12 }}
        {{- end }}
          {{- else if eq $store.component "memgraph" }}
          {{- if $root.Values.storeTls.enabled }}
          # ADR-068: Bolt over TLS only; the wrapper restarts the container when the certificate is renewed.
          command: ["sh", "/usr/local/bin/restart-on-renewal.sh", "/run/store-tls/tls.pem", "/usr/lib/memgraph/memgraph"]
          args: ["--log-level=WARNING", "--storage-snapshot-interval-sec=300", "--query-execution-timeout-sec=60", "--bolt-cert-file=/run/store-tls/tls.pem", "--bolt-key-file=/run/store-tls/tls.pem"]
          env:
            - { name: TLS_CHECK_SECONDS, value: {{ $root.Values.storeTls.checkSeconds | quote }} }
          {{- else }}
          args: ["--log-level=WARNING", "--storage-snapshot-interval-sec=300", "--query-execution-timeout-sec=60"]
          {{- end }}
          readinessProbe:
            tcpSocket: { port: 7687 }
            periodSeconds: 5
        {{- if $root.Values.storeTls.enabled }}
        {{- include "openmap.storeTlsAgent" (dict "root" $root "component" "memgraph" "uid" 101 "gid" 103 "ttl" $root.Values.storeTls.memgraphTtl) | nindent 8 }}
        {{- end }}
          {{- else if eq $store.component "clickhouse" }}
          {{- if $root.Values.clickhouse.encryption.enabled }}
          command: ["sh", "/usr/local/bin/with-disk-key.sh"]
          {{- end }}
          env:
            - { name: CLICKHOUSE_DISK_KEY_WAIT_SECONDS, value: {{ $root.Values.clickhouse.encryption.keyWaitSeconds | quote }} }
            - { name: CLICKHOUSE_DB, value: {{ $root.Values.clickhouse.database | quote }} }
            - { name: CLICKHOUSE_USER, value: {{ $root.Values.clickhouse.username | quote }} }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" $root }}-datastores, key: CLICKHOUSE_PASSWORD } } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          readinessProbe:
            httpGet: { path: /ping, port: 8443, scheme: HTTPS }
            periodSeconds: 5
        {{- if $root.Values.clickhouse.encryption.enabled }}
        # REQ-SEC-011 (ADR-067 step 6): renders the encrypted disk's key from OpenBao into a memory volume.
        - name: clickhouse-keys
          image: {{ if $root.Values.image.registry }}{{ $root.Values.image.registry }}/{{ end }}{{ $root.Values.openbao.image }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["agent", "-config=/openbao/config/agent-clickhouse.hcl"]
          securityContext: { runAsUser: 101, runAsGroup: 101 }
          env:
            - { name: BAO_ADDR, value: {{ include "openmap.vaultAddr" $root | quote }} }
            - { name: TLS_COMMON_NAME, value: {{ include "openmap.svc" (dict "root" $root "component" "clickhouse") | quote }} }
            - { name: BAO_CACERT, value: /run/openmap/ca/services-ca.crt }
          resources: {{- toYaml $root.Values.postgres.tde.agentResources | nindent 12 }}
          volumeMounts:
            - { name: clickhouse-key, mountPath: /run/clickhouse-key }
            - { name: clickhouse-approle, mountPath: /openbao/approle-clickhouse, readOnly: true }
            - { name: clickhouse-encryption, mountPath: /openbao/config/agent-clickhouse.hcl, subPath: agent-clickhouse.hcl, readOnly: true }
            {{- include "openmap.caMount" $root | nindent 12 }}
        {{- end }}
          {{- else if eq $store.component "valkey" }}
          {{- if $root.Values.storeTls.enabled }}
          # ADR-068: TLS only; the wrapper points Valkey at a renewed certificate without a restart.
          command: ["tini", "--", "sh", "/usr/local/bin/with-tls.sh"]
          args: ["--appendonly", "yes"]
          env:
            - { name: VALKEY_TLS_SOURCE, value: /run/store-tls/tls.pem }
            - { name: VALKEY_TLS_CHECK_SECONDS, value: {{ $root.Values.storeTls.checkSeconds | quote }} }
          readinessProbe:
            exec: { command: ["valkey-cli", "--tls", "--cacert", "/run/openmap/ca/services-ca.crt", "-h", "localhost", "ping"] }
            periodSeconds: 5
          {{- else }}
          args: ["--appendonly", "yes"]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 5
          {{- end }}
        {{- if $root.Values.storeTls.enabled }}
        {{- include "openmap.storeTlsAgent" (dict "root" $root "component" "valkey" "uid" 999 "gid" 999 "ttl" $root.Values.storeTls.ttl) | nindent 8 }}
        {{- end }}
          {{- else if eq $store.component "meilisearch" }}
          env:
            - { name: MEILI_MASTER_KEY, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" $root }}-datastores, key: MEILI_MASTER_KEY } } }
            - { name: MEILI_NO_ANALYTICS, value: "true" }
            - { name: MEILI_ENV, value: production }
            {{- if $root.Values.storeTls.enabled }}
            - { name: MEILI_SSL_CERT_PATH, value: /run/store-tls/tls.pem }
            - { name: MEILI_SSL_KEY_PATH, value: /run/store-tls/tls.pem }
            - { name: TLS_CHECK_SECONDS, value: {{ $root.Values.storeTls.checkSeconds | quote }} }
            {{- end }}
          {{- if $root.Values.storeTls.enabled }}
          # ADR-068: HTTPS only; the wrapper restarts the container (seconds) when the certificate is renewed.
          command: ["tini", "--", "sh", "/usr/local/bin/restart-on-renewal.sh", "/run/store-tls/tls.pem", "/bin/meilisearch"]
          args: []
          {{- end }}
          readinessProbe:
            {{- if $root.Values.storeTls.enabled }}
            # Meilisearch answers TLS clients that send a server name only, and the kubelet's HTTPS probe connects by
            # IP without one; curl to localhost sends it (the certificate names localhost).
            exec: { command: ["curl", "-fsS", "--cacert", "/run/openmap/ca/services-ca.crt", "https://localhost:7700/health"] }
            {{- else }}
            httpGet: { path: /health, port: 7700 }
            {{- end }}
            periodSeconds: 5
        {{- if $root.Values.storeTls.enabled }}
        {{- include "openmap.storeTlsAgent" (dict "root" $root "component" "meilisearch" "uid" 100 "gid" 1000 "ttl" $root.Values.storeTls.ttl) | nindent 8 }}
        {{- end }}
          {{- end }}
      {{- if eq $store.component "postgres" }}
      {{- if $root.Values.postgres.tde.enabled }}
      initContainers:
        # The Percona image runs PostgreSQL as uid 26, which can neither own nor chmod a fresh root-owned volume.
        - name: own-data
          image: {{ if $root.Values.image.registry }}{{ $root.Values.image.registry }}/{{ end }}{{ $store.image }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["sh", "-c", "chown 26:26 {{ $store.mount }} && chmod 0700 {{ $store.mount }}"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - name: data
              mountPath: {{ $store.mount }}
        {{- include "openmap.serviceCaInit" $root | nindent 8 }}
      {{- end }}
      volumes:
        {{- if $root.Values.postgres.tde.enabled }}
        {{- include "openmap.caVolume" $root | nindent 8 }}
        {{- end }}
        - name: init
          # Executable, so the entrypoint runs the pg_tde script rather than sourcing it.
          configMap:
            name: {{ include "openmap.fullname" $root }}-postgres-init
            defaultMode: 0555
            items:
              - { key: 01-schemas.sql, path: 01-schemas.sql }
              {{- if $root.Values.postgres.tde.enabled }}
              - { key: 00-pg-tde.sh, path: 00-pg-tde.sh }
              {{- end }}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: {{ $root.Values.postgres.shmSize }} }
        - name: hba
          configMap: { name: {{ include "openmap.fullname" $root }}-postgres-init, items: [{ key: pg_hba.conf, path: pg_hba.conf }] }
        {{- if $root.Values.postgres.tde.enabled }}
        # The token never touches a disk.
        - name: pgtde-token
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: pgtde-config
          configMap: { name: {{ include "openmap.fullname" $root }}-postgres-init, items: [{ key: agent-pgtde.hcl, path: agent-pgtde.hcl }] }
        - name: pgtde-approle
          secret:
            {{- if $root.Values.openbao.external.enabled }}
            secretName: {{ required "postgres.tde.externalApproleSecret is required with openbao.external and postgres.tde" $root.Values.postgres.tde.externalApproleSecret }}
            items: [{ key: role-id, path: role-id }, { key: secret-id, path: secret-id }]
            {{- else }}
            secretName: {{ include "openmap.fullname" $root }}-openbao-approle
            items: [{ key: pgtde-role-id, path: role-id }, { key: pgtde-secret-id, path: secret-id }]
            {{- end }}
            defaultMode: 0440
        {{- end }}
      {{- end }}
      {{- if and (eq $store.component "clickhouse") $root.Values.clickhouse.encryption.enabled }}
      initContainers:
        {{- include "openmap.serviceCaInit" $root | nindent 8 }}
      volumes:
        {{- include "openmap.caVolume" $root | nindent 8 }}
        - name: clickhouse-encryption
          configMap: { name: {{ include "openmap.fullname" $root }}-clickhouse-encryption, defaultMode: 0555 }
        # The disk key never touches a disk.
        - name: clickhouse-key
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: clickhouse-approle
          secret:
            {{- if $root.Values.openbao.external.enabled }}
            secretName: {{ required "clickhouse.encryption.externalApproleSecret is required with openbao.external and clickhouse.encryption" $root.Values.clickhouse.encryption.externalApproleSecret }}
            items: [{ key: role-id, path: role-id }, { key: secret-id, path: secret-id }]
            {{- else }}
            secretName: {{ include "openmap.fullname" $root }}-openbao-approle
            items: [{ key: clickhouse-role-id, path: role-id }, { key: clickhouse-secret-id, path: secret-id }]
            {{- end }}
            defaultMode: 0440
      {{- end }}
      {{- if and $root.Values.storeTls.enabled (has $store.component (list "memgraph" "valkey" "meilisearch")) }}
      {{- if ne $store.component "memgraph" }}
      initContainers:
        {{- include "openmap.serviceCaInit" $root | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "openmap.storeTlsVolumes" $root | nindent 8 }}
        {{- include "openmap.caVolume" $root | nindent 8 }}
        {{- if eq $store.component "valkey" }}
        - name: valkey-live
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- end }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $root.Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $store.storage }}
{{- end }}
