{{- /*
REQ-SEC-011 (ADR-067) — OpenBao in server mode unless openbao.external points at an existing vault: Raft storage on a
persistent volume, auto-unseal (the static key seal with a key the chart generates once and keeps, or the seal block in
openbao.seal.config for PKCS#11 or KMIP), and a post-install/upgrade job that initialises it, writes the policies and
registers the AppRole ids the chart generated (kept across upgrades) for the services, the backup job and the OpenBao
Agent beside PostgreSQL (pg_tde's principal key).
*/ -}}
{{- if and .Values.openbao.external.enabled .Values.openbao.external.caBundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmap.fullname" . }}-openbao-external-ca
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
data:
  ca.crt: |
{{ .Values.openbao.external.caBundle | indent 4 }}
{{- end }}
{{- if not .Values.openbao.external.enabled }}
{{- $fullname := include "openmap.fullname" . }}
{{- $tls := include "openmap.openbaoTls" . | fromYaml }}
---
# ADR-068: OpenBao's listener certificate and the CA that signed it (its key is not kept, so it signs nothing else).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-openbao-tls
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    openmap.io/not-after: {{ $tls.notAfter | quote }}
type: Opaque
data:
  ca.crt: {{ index $tls "ca.crt" }}
  tls.crt: {{ index $tls "tls.crt" }}
  tls.key: {{ index $tls "tls.key" }}
{{- $sealName := printf "%s-openbao-seal" $fullname }}
{{- $approleName := printf "%s-openbao-approle" $fullname }}
{{- $existingSeal := lookup "v1" "Secret" .Release.Namespace $sealName }}
{{- $existingApprole := lookup "v1" "Secret" .Release.Namespace $approleName }}
{{- if not .Values.openbao.seal.config }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sealName }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
  annotations: { "helm.sh/resource-policy": keep }
type: Opaque
data:
  # 32 random bytes for AES-256-GCM, generated once; keep a copy offline: without it the data cannot be unsealed.
  unseal.key: {{ if $existingSeal }}{{ index $existingSeal.data "unseal.key" }}{{ else }}{{ randBytes 32 }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $approleName }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
  annotations: { "helm.sh/resource-policy": keep }
type: Opaque
data:
  {{- range $key := list "role-id" "secret-id" "backup-role-id" "backup-secret-id" "pgtde-role-id" "pgtde-secret-id" "clickhouse-role-id" "clickhouse-secret-id" "stores-role-id" "stores-secret-id" }}
  {{- /* An id is kept once generated; one added by a later chart version is generated on that upgrade. */}}
  {{ $key }}: {{ if and $existingApprole (hasKey $existingApprole.data $key) }}{{ index $existingApprole.data $key }}{{ else }}{{ uuidv4 | b64enc }}{{ end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-openbao
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
data:
  openbao.hcl: |
    ui            = false
    disable_mlock = true
    api_addr      = "https://{{ $fullname }}-openbao:8200"
    cluster_addr  = "https://{{ $fullname }}-openbao:8201"
    storage "raft" {
      path    = "/openbao/data"
      node_id = "openbao-0"
    }
    listener "tcp" {
      address         = "0.0.0.0:8200"
      tls_cert_file   = "/openbao/tls/tls.crt"
      tls_key_file    = "/openbao/tls/tls.key"
      tls_min_version = "tls12"
      telemetry { unauthenticated_metrics_access = true }
    }
    {{- if .Values.openbao.seal.config }}
    {{- .Values.openbao.seal.config | nindent 4 }}
    {{- else }}
    seal "static" {
      current_key_id = {{ .Values.openbao.seal.keyId | quote }}
      current_key    = "file:///openbao/unseal/unseal.key"
    }
    {{- end }}
    telemetry {
      prometheus_retention_time = "24h"
      disable_hostname          = true
    }
  init.sh: |
{{ .Files.Get "files/openbao/init.sh" | indent 4 }}
  openmap-services.hcl: |
{{ .Files.Get "files/openbao/policies/openmap-services.hcl" | indent 4 }}
  openmap-backup.hcl: |
{{ .Files.Get "files/openbao/policies/openmap-backup.hcl" | indent 4 }}
  pg-tde.hcl: |
{{ .Files.Get "files/openbao/policies/pg-tde.hcl" | indent 4 }}
  clickhouse-disk.hcl: |
{{ .Files.Get "files/openbao/policies/clickhouse-disk.hcl" | indent 4 }}
  store-tls.hcl: |
{{ .Files.Get "files/openbao/policies/store-tls.hcl" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "openbao") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
spec:
  selector: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 4 }}
  ports: [{ name: https, port: 8200, targetPort: 8200 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "openbao") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
spec:
  serviceName: {{ include "openmap.svc" (dict "root" . "component" "openbao") }}
  replicas: 1
  selector:
    matchLabels: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 8 }}
      annotations: { {{ include "openmap.openbaoCaChecksum" . }} }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: openbao
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.openbao.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "-config=/openbao/config/openbao.hcl"]
          ports: [{ containerPort: 8200 }]
          # Ready once the API answers, initialised or not: the init job reaches OpenBao through this Service to
          # initialise it (sys/health answers 501 before that, 503 sealed). The clients retry while it is sealed.
          readinessProbe:
            httpGet: { path: "/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true", port: 8200, scheme: HTTPS }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /openbao/data }
            - { name: config, mountPath: /openbao/config }
            - { name: tls, mountPath: /openbao/tls, readOnly: true }
            {{- if not .Values.openbao.seal.config }}
            - { name: unseal, mountPath: /openbao/unseal, readOnly: true }
            {{- end }}
          resources: {{- toYaml .Values.openbao.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ $fullname }}-openbao, items: [{ key: openbao.hcl, path: openbao.hcl }] }
        # Group-readable for the openbao user (gid 1000) through the pod's fsGroup.
        - name: tls
          secret: { secretName: {{ $fullname }}-openbao-tls, defaultMode: 0440, items: [{ key: tls.crt, path: tls.crt }, { key: tls.key, path: tls.key }] }
        {{- if not .Values.openbao.seal.config }}
        - name: unseal
          # Group-readable: the openbao user (gid 1000) reads it through the pod's fsGroup.
          secret: { secretName: {{ $sealName }}, defaultMode: 0440 }
        {{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.global.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.openbao.storage }} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-openbao-init
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
  annotations: { "helm.sh/resource-policy": keep }
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.global.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: 64Mi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-openbao-init
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao-init") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "openmap.selector" (dict "root" . "component" "openbao-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.openbao.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/openbao/scripts/init.sh"]
          env:
            - { name: BAO_ADDR, value: {{ printf "https://%s:8200" (include "openmap.svc" (dict "root" . "component" "openbao")) | quote }} }
            - { name: BAO_CACERT, value: /openbao/tls-ca/ca.crt }
            - { name: OPENBAO_MOUNT, value: {{ .Values.openbao.mount | quote }} }
            # ADR-068: the names the internal services CA may issue server certificates for.
            {{- $f := include "openmap.fullname" . }}
            - { name: SERVICE_TLS_NAMES, value: {{ printf "%s-postgres,%s-clickhouse,%s-memgraph,%s-valkey,%s-meilisearch,%s-openbao,localhost" $f $f $f $f $f $f | quote }} }
            - { name: SERVICES_ROLE_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: role-id } } }
            - { name: SERVICES_SECRET_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: secret-id } } }
            - { name: BACKUP_ROLE_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: backup-role-id } } }
            - { name: BACKUP_SECRET_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: backup-secret-id } } }
            - { name: PGTDE_ROLE_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: pgtde-role-id } } }
            - { name: PGTDE_SECRET_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: pgtde-secret-id } } }
            - { name: CLICKHOUSE_ROLE_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: clickhouse-role-id } } }
            - { name: CLICKHOUSE_SECRET_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: clickhouse-secret-id } } }
            - { name: STORES_ROLE_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: stores-role-id } } }
            - { name: STORES_SECRET_ID, valueFrom: { secretKeyRef: { name: {{ $approleName }}, key: stores-secret-id } } }
            - { name: SERVICE_TLS_MAX_TTL, value: {{ .Values.storeTls.maxTtl | quote }} }
          volumeMounts:
            - { name: init, mountPath: /openbao/init }
            - { name: scripts, mountPath: /openbao/scripts }
            - { name: policies, mountPath: /openbao/policies }
            - { name: tls-ca, mountPath: /openbao/tls-ca, readOnly: true }
      volumes:
        - name: init
          persistentVolumeClaim: { claimName: {{ $fullname }}-openbao-init }
        - name: scripts
          configMap: { name: {{ $fullname }}-openbao, items: [{ key: init.sh, path: init.sh }] }
        - name: tls-ca
          secret: { secretName: {{ $fullname }}-openbao-tls, items: [{ key: ca.crt, path: ca.crt }] }
        - name: policies
          configMap: { name: {{ $fullname }}-openbao, items: [{ key: openmap-services.hcl, path: openmap-services.hcl }, { key: openmap-backup.hcl, path: openmap-backup.hcl }, { key: pg-tde.hcl, path: pg-tde.hcl }, { key: clickhouse-disk.hcl, path: clickhouse-disk.hcl }, { key: store-tls.hcl, path: store-tls.hcl }] }
{{- end }}
