# REQ-INT-003 REQ-SEC-011 — datastore credentials as one Secret the services reference by key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmap.fullname" . }}-datastores
  labels: {{- include "openmap.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.username .Values.postgres.password (include "openmap.fullname" .) .Values.postgres.database | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  MEILI_MASTER_KEY: {{ .Values.meilisearch.masterKey | quote }}
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  OPENBAO_TOKEN: {{ .Values.openbao.token | quote }}
