# REQ-INT-003 REQ-SEC-001 REQ-SEC-002 — Keycloak (realm imported from the chart ConfigMap) and the
# in-cluster OpenBao used unless openbao.external.enabled points at an existing vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmap.fullname" . }}-keycloak-realm
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
data:
  realm-openmap.json: |-
{{ .Files.Get "files/realm-openmap.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "keycloak") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  selector: {{- include "openmap.selector" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "keycloak") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "openmap.selector" (dict "root" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openmap.selector" (dict "root" . "component" "keycloak") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: keycloak
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start", "--import-realm", "--http-enabled=true", "--hostname-strict=false", "--proxy-headers=xforwarded"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" . }}-datastores, key: KEYCLOAK_ADMIN } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" . }}-datastores, key: KEYCLOAK_ADMIN_PASSWORD } } }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ include "openmap.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}?currentSchema=keycloak" }
            - { name: KC_DB_USERNAME, value: {{ .Values.postgres.username | quote }} }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" . }}-datastores, key: POSTGRES_PASSWORD } } }
            - { name: KC_HOSTNAME, value: {{ .Values.keycloak.publicUrl | quote }} }
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          readinessProbe:
            httpGet: { path: /realms/{{ .Values.keycloak.realm }}, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm
          configMap: { name: {{ include "openmap.fullname" . }}-keycloak-realm }
{{- if not .Values.openbao.external.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "openbao") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
spec:
  selector: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 4 }}
  ports: [{ name: http, port: 8200, targetPort: 8200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmap.svc" (dict "root" . "component" "openbao") }}
  labels: {{- include "openmap.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openmap.selector" (dict "root" . "component" "openbao") | nindent 8 }}
    spec:
      containers:
        - name: openbao
          image: {{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.openbao.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - { name: BAO_DEV_ROOT_TOKEN_ID, valueFrom: { secretKeyRef: { name: {{ include "openmap.fullname" . }}-datastores, key: OPENBAO_TOKEN } } }
          ports: [{ containerPort: 8200 }]
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }
            periodSeconds: 5
{{- end }}
