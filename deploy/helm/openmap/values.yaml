# REQ-INT-003 — default values. Every value mirrors the documented defaults in packages/config/src/env.ts
# and deploy/compose. Set image.registry to the mirror for air-gapped clusters (REQ-INT-002).
image:
  registry: ""
  repositoryPrefix: openmap
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

global:
  tenantDefaultLocale: en
  storageClass: ""

api:
  replicas: 2
  port: 4000
  publicUrl: http://openmap.localhost
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

console:
  enabled: true
  replicas: 2
  port: 3000
  publicUrl: http://openmap.localhost
  # A second address the console is opened at (PUBLIC_CONSOLE_ALIAS_URL); empty: only publicUrl.
  aliasUrl: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

scheduler:
  replicas: 1
  port: 4200
  publicHost: scheduler.openmap.localhost
  nodeCertValidityDays: 90
  pkiStorage: 1Gi
  evidenceStorage: 20Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

reconciler:
  replicas: 2
  # /metrics, /healthz and /readyz (RECONCILER_PORT)
  port: 4100
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }

bsmEngine:
  replicas: 1
  # /metrics, /healthz and /readyz (BSM_ENGINE_PORT)
  port: 4400
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

migrate:
  backoffLimit: 6
  # Seconds between readiness polls while the job waits for Postgres and the services wait for the migrations.
  pollSeconds: 5

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls: []

postgres:
  # REQ-SEC-011 (ADR-067): Percona Server for PostgreSQL with pg_tde; PGDATA is /data/db.
  image: percona/percona-distribution-postgresql:17.11.1-4
  # Collation and character type of the database, fixed when the data directory is first initialised (the image sets
  # no LANG; without this initdb uses C).
  locale: en_US.UTF-8
  storage: 50Gi
  tde:
    # Every table tde_heap and the WAL encrypted, the principal key in OpenBao (mount `tde`) through an OpenBao Agent
    # sidecar. Takes effect when the data directory is first initialised.
    enabled: true
    # How long first initialisation waits for the agent's token (the OpenBao init job runs after the pods start).
    tokenWaitSeconds: 900
    # With openbao.external: a Secret holding `role-id` and `secret-id` of an AppRole on the pg-tde policy
    # (deploy/compose/openbao/policies/pg-tde.hcl) in the external vault, which must have a KV v2 mount `tde`.
    externalApproleSecret: ""
    agentResources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 200m, memory: 128Mi }
  database: openmap
  username: openmap
  password: openmap
  # Memory-backed /dev/shm for parallel query workers; a pod's 64 MB default fails a full-scale reconciliation lookup.
  shmSize: 1Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "4", memory: 8Gi }

memgraph:
  image: memgraph/memgraph-mage:3.4
  storage: 50Gi
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { cpu: "8", memory: 32Gi }

clickhouse:
  image: clickhouse/clickhouse-server:25.8
  storage: 100Gi
  database: openmap
  username: openmap
  password: openmap
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "8", memory: 16Gi }
  encryption:
    # REQ-SEC-011 (ADR-067 step 6): data parts on an encrypted disk (AES-256-CTR), its key in OpenBao
    # (tde/clickhouse-disk) through an OpenBao Agent sidecar. Takes effect on an empty data volume.
    enabled: true
    keyWaitSeconds: 900
    # With openbao.external: a Secret holding `role-id` and `secret-id` of an AppRole on the clickhouse-disk policy.
    externalApproleSecret: ""

# REQ-SEC-011 (ADR-068): Valkey, Memgraph and Meilisearch over TLS only, each with an OpenBao Agent sidecar that keeps its
# server certificate from the internal services CA. Valkey takes a renewed certificate live; Meilisearch and Memgraph
# restart their container (Memgraph reloads its snapshot, minutes: hence its year-long certificate).
storeTls:
  enabled: true
  ttl: 720h
  memgraphTtl: 8760h
  # Up to how long the services CA issues a certificate (the longest ttl above).
  maxTtl: 8760h
  # How often the wrappers compare the rendered certificate (seconds).
  checkSeconds: 60
  # With openbao.external: a Secret holding `role-id` and `secret-id` of an AppRole on the store-tls policy.
  externalApproleSecret: ""
  agentResources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

valkey:
  image: valkey/valkey:8
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 2Gi }

meilisearch:
  image: getmeili/meilisearch:v1.15
  storage: 20Gi
  masterKey: openmap-dev-master-key
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 4Gi }

keycloak:
  image: quay.io/keycloak/keycloak:26.3
  realm: openmap
  # Public client the console signs in through (KEYCLOAK_CLIENT_ID); the realm export defines it.
  consoleClientId: openmap-console
  adminUser: admin
  adminPassword: admin
  publicUrl: http://auth.openmap.localhost
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

openbao:
  # REQ-SEC-011 (ADR-067): server mode, Raft on a persistent volume, auto-unseal.
  image: openbao/openbao:2.7.2
  mount: openmap
  storage: 10Gi
  seal:
    # Empty: the static key seal with a key the chart generates once (Secret <release>-openbao-seal; keep a copy
    # offline). Set to a full seal block (seal "pkcs11" { ... } or seal "kmip" { ... }) to use an HSM or a KMS.
    config: ""
    keyId: chart-1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # ADR-068: OpenBao's listener serves TLS only, on a certificate the chart generates (OpenBao cannot issue its own
  # before it runs) and keeps in Secret <release>-openbao-tls. The chart makes a new one, with a new CA, on the first
  # `helm upgrade` within renewDays of its expiry; OpenBao and every pod that trusts the CA roll with it.
  tls:
    days: 730
    renewDays: 60
  external:
    enabled: false
    address: ""
    # Token for the external vault (the services then skip AppRole).
    token: ""
    # The CA bundle that verifies an external vault's https address; empty: the system CAs.
    caBundle: ""

llm:
  enabled: false
  url: ""
