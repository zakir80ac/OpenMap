// REQ-IPAM-003 (ADR-055) — the lab's authoritative DNS server (BIND 9, ISC, MPL-2.0, a separate process): one dynamic
// zone that OpenMap transfers (AXFR) and updates (RFC 2136), both only with the openmap-sync TSIG key. The key file is
// written at start from DNS_LAB_TSIG_SECRET (entrypoint.sh), so no secret is in the repository.
options {
  directory "/var/cache/bind";
  listen-on { any; };
  listen-on-v6 { none; };
  allow-query { any; };
  recursion no;
  dnssec-validation no;
};

include "/run/dns-lab/openmap-sync.key";

zone "lab.openmap.test" {
  type primary;
  file "/var/lib/bind/lab.openmap.test.db";
  allow-transfer { key openmap-sync; };
  allow-update { key openmap-sync; };
};
