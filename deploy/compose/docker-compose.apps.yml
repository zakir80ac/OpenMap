# REQ-INT-001 REQ-INT-002 — OpenMap application services on top of the infrastructure stack:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
# `migrate` applies Postgres, ClickHouse and Memgraph migrations once and exits; the services wait
# for it. Service hostnames are the compose service names; every other value mirrors the documented
# defaults in packages/config/src/env.ts and can be overridden from .env.
name: openmap

x-restart: &restart
  restart: unless-stopped

x-app-env: &app-env
  NODE_ENV: production
  POSTGRES_URL: postgresql://${POSTGRES_USER:-openmap}:${POSTGRES_PASSWORD:-openmap}@postgres:5432/${POSTGRES_DB:-openmap}
  MEMGRAPH_URL: bolt://memgraph:7687
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-openmap}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-openmap}
  CLICKHOUSE_DB: ${CLICKHOUSE_DB:-openmap}
  VALKEY_URL: redis://valkey:6379
  MEILI_URL: http://meilisearch:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-openmap-dev-master-key}
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-openmap}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-openmap-console}
  OPENBAO_ADDR: http://openbao:8200
  # REQ-SEC-011 (ADR-067): services log in with AppRole; openbao-init writes the ids into the openbao-approle volume.
  OPENBAO_ROLE_ID_FILE: /run/openmap/openbao/role-id
  OPENBAO_SECRET_ID_FILE: /run/openmap/openbao/secret-id
  SUPERSET_URL: http://superset:8088
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-cpu:8000/v1}
  # ADR-028: the CPU fallback model rewords English reliably and Arabic poorly; Arabic answers stay deterministic here.
  ASSISTANT_PROSE_LOCALES: ${ASSISTANT_PROSE_LOCALES:-en}
  # REQ-BSM-004 / REQ-BSM-007: the impact-validation sweep and the link-probe round (milliseconds; 0 turns either off).
  IMPACT_VALIDATION_INTERVAL_MS: ${IMPACT_VALIDATION_INTERVAL_MS:-60000}
  LINK_PROBE_INTERVAL_MS: ${LINK_PROBE_INTERVAL_MS:-60000}
  # REQ-AI-003: the anomaly sweep (milliseconds; 0 turns it off).
  ANOMALY_INTERVAL_MS: ${ANOMALY_INTERVAL_MS:-300000}
  # REQ-IPAM-003: the DNS sync round and the pull interval of a zone with no pending change (milliseconds).
  DNS_SYNC_INTERVAL_MS: ${DNS_SYNC_INTERVAL_MS:-30000}
  DNS_PULL_INTERVAL_MS: ${DNS_PULL_INTERVAL_MS:-900000}
  # REQ-CORE-020: concurrent outbox dispatch loops per reconciler (claims are leased, so loops never share a row).
  RECONCILER_DISPATCHERS: ${RECONCILER_DISPATCHERS:-1}
  # REQ-INT-005 REQ-INT-009: outbound integrations and notifications stay off unless the deployment turns them on (the
  # airgap profile keeps them off whatever this says); each tenant has its own switch on top.
  FEATURE_OUTBOUND_INTEGRATIONS: ${FEATURE_OUTBOUND_INTEGRATIONS:-false}
  PUBLIC_SUPERSET_URL: ${PUBLIC_SUPERSET_URL:-http://localhost:8088}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
  PUBLIC_CONSOLE_URL: ${PUBLIC_CONSOLE_URL:-http://localhost:3000}
  # The loopback IP form of the console's address, so a browser opened on 127.0.0.1 signs in and reaches the API too.
  PUBLIC_CONSOLE_ALIAS_URL: ${PUBLIC_CONSOLE_ALIAS_URL:-http://127.0.0.1:3000}
  PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}

x-app-depends: &app-depends
  postgres: { condition: service_healthy }
  memgraph: { condition: service_healthy }
  clickhouse: { condition: service_healthy }
  valkey: { condition: service_healthy }
  meilisearch: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }
  openbao-init: { condition: service_completed_successfully }

services:
  migrate:
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/reconciler:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args: { APP: reconciler }
    environment: *app-env
    command: ["node", "node_modules/@openmap/db/dist/cli.js", "all"]
    depends_on:
      postgres: { condition: service_healthy }
      memgraph: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  api:
    <<: *restart
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/api:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args: { APP: api }
    environment:
      <<: *app-env
      API_PORT: 4000
      # REQ-INT-019: the API lists backup sets (manifests only) from the backup volume, read-only.
      BACKUP_DIR: /var/lib/openmap/backups
    volumes: ["backups:/var/lib/openmap/backups:ro", "openbao-approle:/run/openmap/openbao:ro"]
    ports: ["${API_PORT:-4000}:4000"]
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  # REQ-INT-019 (ADR-066) — backups of the stores of record, on demand or from the host's scheduler:
  #   docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile backup run --rm backup [create|verify NAME|restore NAME|list|prune]
  # After a restore, rebuild Memgraph and Meilisearch: ... run --rm migrate node dist/reproject.js
  backup:
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/backup:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/backup.Dockerfile
    profiles: [backup]
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-openmap}:${POSTGRES_PASSWORD:-openmap}@postgres:5432/${POSTGRES_DB:-openmap}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-openmap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-openmap}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-openmap}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # REQ-SEC-011 (ADR-067): the backup AppRole may take an OpenBao Raft snapshot and nothing else.
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_ROLE_ID_FILE: /run/openmap/openbao-backup/role-id
      OPENBAO_SECRET_ID_FILE: /run/openmap/openbao-backup/secret-id
    volumes: ["backups:/backups", "openbao-approle-backup:/run/openmap/openbao-backup:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  console:
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/console:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/console.Dockerfile
    environment:
      <<: *app-env
      CONSOLE_PORT: "3000"
    ports: ["${CONSOLE_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    <<: *restart
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/scheduler:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args: { APP: scheduler }
    environment:
      <<: *app-env
      SCHEDULER_PORT: 4200
      SCHEDULER_CA_CERT_PATH: /etc/openmap/pki/ca.crt
      SCHEDULER_CA_KEY_PATH: /etc/openmap/pki/ca.key
      SCHEDULER_TLS_CERT_PATH: /etc/openmap/pki/scheduler.crt
      SCHEDULER_TLS_KEY_PATH: /etc/openmap/pki/scheduler.key
      EVIDENCE_DIR: /var/lib/openmap/evidence
      # Nodes inside the compose network reach the scheduler by service name; external Nodes by the public host.
      PUBLIC_SCHEDULER_URL: https://scheduler:4200
      SCHEDULER_TLS_EXTRA_SANS: ${SCHEDULER_TLS_EXTRA_SANS:-localhost}
    # pki:init is idempotent: it writes the CA and server certificate on first start and never overwrites them.
    command: ["sh", "-c", "node dist/pki-init.js && exec node dist/main.js"]
    ports: ["${SCHEDULER_PORT:-4200}:4200"]
    volumes: [scheduler-pki:/etc/openmap/pki, evidence:/var/lib/openmap/evidence, "openbao-approle:/run/openmap/openbao:ro"]
    depends_on: *app-depends

  reconciler:
    <<: *restart
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/reconciler:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args: { APP: reconciler }
    environment: *app-env
    # REQ-SEC-011 (ADR-067 step 4): `encrypt-fields` encrypts personal data written before field encryption.
    volumes: ["openbao-approle:/run/openmap/openbao:ro"]
    depends_on: *app-depends

  bsm-engine:
    <<: *restart
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/bsm-engine:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args: { APP: bsm-engine }
    environment: *app-env
    volumes: ["openbao-approle:/run/openmap/openbao:ro"]
    depends_on: *app-depends

  node:
    <<: *restart
    profiles: [node]
    image: ${OPENMAP_IMAGE_PREFIX:-openmap}/node:${OPENMAP_VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
    environment:
      OPENMAP_NODE_ID: ${OPENMAP_NODE_ID:-node-compose-01}
      OPENMAP_SITE_CODE: ${OPENMAP_SITE_CODE:-LOCAL}
      OPENMAP_SCHEDULER_URL: https://scheduler:4200
      OPENMAP_ENROL_TOKEN: ${OPENMAP_ENROL_TOKEN:-}
      NODE_MTLS_CA_PATH: /etc/openmap/pki/ca.crt
      NODE_MTLS_CERT_PATH: /etc/openmap/pki/node.crt
      NODE_MTLS_KEY_PATH: /etc/openmap/pki/node.key
      # Single-node profile only: the Node reads the scheduler's CA from the shared volume to trust it
      # during enrolment. Remote sites receive the CA file out of band and leave this unset.
      OPENMAP_BOOTSTRAP_CA_PATH: /etc/openmap/bootstrap/ca.crt
      # REQ-DISC-004 — host agents at this site enrol and report here over mTLS (empty disables the gateway).
      OPENMAP_AGENT_LISTEN_ADDR: ${OPENMAP_AGENT_LISTEN_ADDR:-:4300}
    ports: ["${OPENMAP_AGENT_PORT:-4300}:4300"]
    volumes: [node-pki:/etc/openmap/pki, node-evidence:/var/lib/openmap/evidence, "scheduler-pki:/etc/openmap/bootstrap:ro"]
    networks:
      default:
        # The Node's certificate names its node id; agents in the compose network reach it under that name.
        aliases: ["${OPENMAP_NODE_ID:-node-compose-01}"]
    depends_on:
      scheduler: { condition: service_started }

  # REQ-IPAM-003 (ADR-055): a lab authoritative DNS server (BIND 9, a separate process) the compose Node keeps in sync
  # both ways; used by the DNS sync e2e. Start with --profile lab; DNS_LAB_TSIG_SECRET (base64) comes from .env.
  dns-lab:
    profiles: [lab]
    image: internetsystemsconsortium/bind9:9.20
    entrypoint: ["/bin/sh", "/etc/bind/lab/entrypoint.sh"]
    environment:
      DNS_LAB_TSIG_SECRET: ${DNS_LAB_TSIG_SECRET:-}
    volumes:
      - ./dns-lab:/etc/bind/lab:ro
      - dns-lab-data:/var/lib/bind
    restart: unless-stopped

volumes:
  dns-lab-data:
  scheduler-pki:
  evidence:
  node-pki:
  node-evidence:
