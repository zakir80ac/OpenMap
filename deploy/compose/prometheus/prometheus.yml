# REQ-CORE-014 — Prometheus scrape configuration for the single-node profile.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  # Every OpenMap service serves /metrics, /healthz and /readyz: the API on its port, the scheduler on its plain-HTTP
  # metrics port (the Node API is mTLS), the reconciler and the BSM engine on theirs. Targets are compose service names.
  - job_name: openmap-services
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000", "reconciler:4100", "scheduler:4201", "bsm-engine:4400"]
  # ClickHouse serves Prometheus metrics on 9363 through deploy/compose/clickhouse/prometheus.xml (config.d).
  - job_name: clickhouse
    static_configs: [{ targets: ["clickhouse:9363"] }]
  # REQ-SEC-011 (ADR-067): OpenBao's telemetry (the listener allows unauthenticated metrics). A sealed OpenBao answers 503 here, so up{job="openbao"} drops to 0; vault_core_active is 1 on the active node.
  - job_name: openbao
    metrics_path: /v1/sys/metrics
    # ADR-068: OpenBao serves TLS only, verified against the internal services CA bundle.
    scheme: https
    tls_config: { ca_file: /etc/prometheus/ca/services-ca.crt }
    params: { format: [prometheus] }
    static_configs: [{ targets: ["openbao:8200"] }]
  # Memgraph Community exposes no Prometheus endpoint (the HTTP metrics server is an Enterprise feature); the graph
  # store's health is observed through the API's readiness probe and the reconciler's outbox delivery counters.
