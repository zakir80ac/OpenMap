# REQ-CORE-014 — Prometheus scrape configuration for the single-node profile.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: openmap-services
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000", "host.docker.internal:4100", "host.docker.internal:4200", "host.docker.internal:4300", "host.docker.internal:4400"]
  - job_name: clickhouse
    static_configs: [{ targets: ["clickhouse:9363"] }]
  - job_name: memgraph
    static_configs: [{ targets: ["memgraph:9091"] }]
