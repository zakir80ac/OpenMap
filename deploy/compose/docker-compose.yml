# REQ-INT-001 — single-node stack. Profiles: default (dev), airgap (pull_policy never, no optional egress),
# gpu (vLLM) and cpu (llama.cpp server). Every value here mirrors the documented defaults in packages/config.
name: openmap

x-restart: &restart
  restart: unless-stopped

services:
  # REQ-SEC-011 step 3 (ADR-067) — Percona Server for PostgreSQL 17 with pg_tde: every table tde_heap, the WAL
  # encrypted, the principal key in OpenBao (mount `tde`) through pgtde-agent's token file. PGDATA is /data/db.
  postgres:
    <<: *restart
    image: percona/percona-distribution-postgresql:17.11.1-4
    # ADR-068: TLS required (pg_hba.conf), the certificate rendered by pgtde-agent, whose process namespace PostgreSQL
    # joins so the agent can tell the postmaster to reload a renewed certificate.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_tde
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pgtde/tls.pem
      - -c
      - ssl_key_file=/run/pgtde/tls.pem
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/openmap/pg_hba.conf
    pid: "service:pgtde-agent"
    # Parallel query workers share memory through /dev/shm; Docker's 64 MB default fails a full-scale reconciliation
    # lookup ("could not resize shared memory segment", REQ-CORE-013 scale-1 replay).
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openmap}
      POSTGRES_DB: ${POSTGRES_DB:-openmap}
      OPENBAO_ADDR: http://openbao:8200
      # The Percona image sets no LANG, so initdb would pick the C collation and every name-ordered list would sort
      # differently (".NET" before "api"); the database is created with the collation stock PostgreSQL used.
      POSTGRES_INITDB_ARGS: "--locale=${POSTGRES_LOCALE:-en_US.UTF-8}"
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - "postgres-tde-data:/data/db"
      - "pgtde-token:/run/pgtde:ro"
      - "./postgres/tde/00-pg-tde.sh:/docker-entrypoint-initdb.d/00-pg-tde.sh:ro"
      - "./postgres/init/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro"
      - "./postgres/pg_hba.conf:/etc/openmap/pg_hba.conf:ro"
    depends_on:
      # restart: PostgreSQL shares the agent's process namespace, so it follows the agent when compose restarts it.
      pgtde-agent: { condition: service_healthy, restart: true }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openmap}"]
      interval: 5s
      timeout: 3s
      retries: 20

  memgraph:
    <<: *restart
    image: memgraph/memgraph-mage:3.4
    command: ["--log-level=WARNING", "--storage-snapshot-interval-sec=300", "--query-execution-timeout-sec=60"]
    ports: ["${MEMGRAPH_PORT:-7687}:7687"]
    volumes: [memgraph-data:/var/lib/memgraph]
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # REQ-SEC-011 step 6 (ADR-067): data parts on an encrypted disk, its key from OpenBao through clickhouse-keys; the
  # wrapper waits for the key and starts the image's entrypoint. Data on the new clickhouse-tde-data volume.
  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:25.3
    entrypoint: ["sh", "/usr/local/bin/with-disk-key.sh"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-openmap}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-openmap}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-openmap}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # ADR-068: HTTPS and the secure native protocol only.
    ports: ["${CLICKHOUSE_PORT:-8443}:8443", "${CLICKHOUSE_NATIVE_PORT:-9440}:9440"]
    # REQ-INT-019: BACKUP / RESTORE write and read under /backups, the volume the backup service shares.
    volumes:
      - "clickhouse-tde-data:/var/lib/clickhouse"
      - "./clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro"
      - "./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro"
      - "./clickhouse/encrypted-disk.xml:/etc/clickhouse-server/config.d/encrypted-disk.xml:ro"
      - "./clickhouse/tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro"
      - "service-ca:/run/openmap/ca:ro"
      - "./clickhouse/with-disk-key.sh:/usr/local/bin/with-disk-key.sh:ro"
      - "clickhouse-key:/run/clickhouse-key:ro"
      - "backups:/backups"
    depends_on:
      clickhouse-keys: { condition: service_healthy }
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    <<: *restart
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    ports: ["${VALKEY_PORT:-6379}:6379"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    <<: *restart
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-openmap-dev-master-key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: ${MEILI_ENV:-development}
    ports: ["${MEILI_PORT:-7700}:7700"]
    volumes: [meili-data:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      # ADR-068: TLS to PostgreSQL, verified against the internal services CA.
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openmap}?ssl=true&sslmode=verify-full&sslrootcert=/run/openmap/ca/services-ca.crt
      KC_DB_USERNAME: ${POSTGRES_USER:-openmap}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-openmap}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      # REQ-SEC-001 — the issuer written into tokens is the URL the browser uses, whichever host a request arrives on;
      # services keep reaching Keycloak over the compose network (backchannel) without changing that issuer.
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into the realm import (redirect URIs and web origins of the console client).
      CONSOLE_PUBLIC_URL: ${PUBLIC_CONSOLE_URL:-http://localhost:3000}
      CONSOLE_ALIAS_URL: ${PUBLIC_CONSOLE_ALIAS_URL:-http://127.0.0.1:3000}
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes: ["./keycloak/realm-openmap.json:/opt/keycloak/data/import/realm-openmap.json:ro", "service-ca:/run/openmap/ca:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # REQ-SEC-011 (ADR-067) — OpenBao in server mode. openbao-keys generates the static seal key once and hands the data
  # and key volumes to the openbao user; openbao-init initialises, configures and issues the services' AppRole ids.
  openbao-keys:
    image: openbao/openbao:2.7.2
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - "[ -s /openbao/unseal/unseal.key ] || head -c 32 /dev/urandom > /openbao/unseal/unseal.key; chown -R openbao:openbao /openbao/unseal /openbao/data; chmod 0400 /openbao/unseal/unseal.key; chown 26:26 /run/pgtde; chmod 0750 /run/pgtde"
    # pgtde-token: the token file the OpenBao Agent writes for pg_tde, owned by PostgreSQL's user (uid 26).
    volumes: [openbao-unseal:/openbao/unseal, openbao-data:/openbao/data, pgtde-token:/run/pgtde]

  openbao:
    <<: *restart
    image: openbao/openbao:2.7.2
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes: ["./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro", "openbao-data:/openbao/data", "openbao-unseal:/openbao/unseal:ro"]
    ports: ["${OPENBAO_PORT:-8200}:8200"]
    depends_on:
      openbao-keys: { condition: service_completed_successfully }
    healthcheck:
      # 200 once initialised and unsealed (501 before initialisation, 503 sealed).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60

  openbao-init:
    image: openbao/openbao:2.7.2
    user: root
    entrypoint: ["sh", "/openbao/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_MOUNT: ${OPENBAO_MOUNT:-openmap}
      SERVICE_UID: "1000"
      # pgtde-agent runs as the Percona image's postgres user (uid 26); every run of this job re-owns the files to it.
      PGTDE_AGENT_UID: "26"
      CLICKHOUSE_AGENT_UID: "101"
    volumes:
      - "./openbao/init.sh:/openbao/init.sh:ro"
      - "./openbao/policies:/openbao/policies:ro"
      - "openbao-init:/openbao/init"
      - "openbao-approle:/openbao/approle"
      - "openbao-approle-backup:/openbao/approle-backup"
      - "openbao-approle-pgtde:/openbao/approle-pgtde"
      - "openbao-approle-clickhouse:/openbao/approle-clickhouse"
      # ADR-068: the internal services CA certificate, for every client.
      - "service-ca:/openbao/service-ca"
    depends_on:
      openbao: { condition: service_started }

  # REQ-SEC-011 (ADR-067 step 6) — OpenBao Agent beside ClickHouse: renders the encrypted disk's key into a memory volume,
  # as the ClickHouse image's user (uid 101).
  clickhouse-keys:
    <<: *restart
    image: openbao/openbao:2.7.2
    user: "101:101"
    command: ["agent", "-config=/openbao/config/agent-clickhouse.hcl"]
    environment:
      BAO_ADDR: http://openbao:8200
      # ADR-068: the name ClickHouse's certificate is issued for.
      TLS_COMMON_NAME: clickhouse
    volumes: ["./openbao/agent-clickhouse.hcl:/openbao/config/agent-clickhouse.hcl:ro", "openbao-approle-clickhouse:/openbao/approle-clickhouse:ro", "clickhouse-key:/run/clickhouse-key"]
    depends_on:
      openbao: { condition: service_healthy }
      openbao-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/clickhouse-key/key && test -s /run/clickhouse-key/tls.pem"]
      interval: 2s
      timeout: 2s
      retries: 30

  # REQ-SEC-011 (ADR-067) — OpenBao Agent beside PostgreSQL: logs in with the pg-tde AppRole and keeps the token pg_tde's
  # key provider reads fresh (as the Percona image's postgres user, uid 26). After revoking that token, restart it.
  pgtde-agent:
    <<: *restart
    image: openbao/openbao:2.7.2
    user: "26:26"
    command: ["agent", "-config=/openbao/config/agent-pgtde.hcl"]
    environment:
      BAO_ADDR: http://openbao:8200
      # ADR-068: the name PostgreSQL's certificate is issued for (the compose service name clients connect to).
      TLS_COMMON_NAME: postgres
    volumes: ["./openbao/agent-pgtde.hcl:/openbao/config/agent-pgtde.hcl:ro", "openbao-approle-pgtde:/openbao/approle-pgtde:ro", "pgtde-token:/run/pgtde"]
    depends_on:
      openbao: { condition: service_healthy }
      openbao-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/pgtde/token && test -s /run/pgtde/tls.pem"]
      interval: 2s
      timeout: 2s
      retries: 30

  superset:
    <<: *restart
    image: apache/superset:4.1.2
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-openmap-dev-superset-secret}
      SUPERSET_LOAD_EXAMPLES: "no"
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_DB: ${POSTGRES_DB:-openmap}
      DATABASE_USER: ${POSTGRES_USER:-openmap}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-openmap}
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports: ["${SUPERSET_PORT:-8088}:8088"]
    volumes: ["./superset/superset_config.py:/app/pythonpath/superset_config.py:ro", "./superset/bootstrap.sh:/app/bootstrap.sh:ro", "service-ca:/run/openmap/ca:ro"]
    entrypoint: ["/bin/bash", "/app/bootstrap.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8088/health | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 40

  llm-gpu:
    <<: *restart
    profiles: [gpu]
    image: vllm/vllm-openai:v0.9.2
    command: ["--model", "${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}", "--port", "8000", "--max-model-len", "8192"]
    ports: ["${LLM_PORT:-8000}:8000"]
    volumes: [model-cache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  llm-cpu:
    <<: *restart
    profiles: [cpu]
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/${LLM_GGUF:-qwen2.5-7b-instruct-q4_k_m.gguf}", "--port", "8000", "--host", "0.0.0.0", "-c", "8192", "--alias", "${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"]
    ports: ["${LLM_PORT:-8000}:8000"]
    volumes: ["${LLM_MODELS_DIR:-./models}:/models:ro"]
    # The image's own check probes llama.cpp's default port; the server is told to listen on 8000 above.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["${OTEL_GRPC_PORT:-4317}:4317", "${OTEL_HTTP_PORT:-4318}:4318"]

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.4.1
    # REQ-PERF-005 (ADR-071): the SLO alert rules beside the scrape configuration.
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./prometheus/rules:/etc/prometheus/rules:ro", prom-data:/prometheus]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]

volumes:
  # REQ-SEC-011 step 3: the pg_tde data directory. Installs before it kept stock PostgreSQL in `postgres-data`; move
  # them with a backup set (deploy/README.md, "Moving to encrypted PostgreSQL").
  postgres-tde-data:
  memgraph-data:
  # REQ-SEC-011 step 6: ClickHouse on the encrypted disk. Installs before it kept plaintext parts in `clickhouse-data`;
  # move them with a backup set (deploy/README.md).
  clickhouse-tde-data:
  valkey-data:
  meili-data:
  model-cache:
  prom-data:
  # REQ-INT-019: backup sets (Postgres archive, ClickHouse backup, manifest); put it on separate, encrypted storage in production.
  backups:
  # REQ-SEC-011 (ADR-067): OpenBao's Raft data, its seal key (keep a copy offline: without it the data cannot be
  # unsealed), the init output (recovery keys and root token: move offline) and the AppRole ids the services read.
  openbao-data:
  openbao-unseal:
  openbao-init:
  openbao-approle:
  openbao-approle-backup:
  openbao-approle-pgtde:
  pgtde-token:
  openbao-approle-clickhouse:
  # ADR-068: the internal services CA certificate (public), written by openbao-init.
  service-ca:
  # The ClickHouse disk key, in memory only.
  clickhouse-key:
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=101,gid=101,mode=0750" }
